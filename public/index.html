}

// Optional presentation fields (HOSTD-83). All public-repo safe: an audience, a start
// density, and a contact's FIRST NAME only — never a number or an address.
function cleanPresentation(value) {
  const raw = objectOr(value);
  return {
    ...(raw.audience === "family" || raw.audience === "operator" ? { audience: raw.audience } : {}),
    ...(raw.density === "tiles" || raw.density === "list" ? { density: raw.density } : {}),
  };
}

function cleanContact(value) {
  const raw = objectOr(value);
  return isLocalizable(raw.name) ? { name: raw.name } : null;
}

function manifestToConfig(manifest) {
  if (!isObject(manifest)) throw new Error("manifest is not an object");
  if (manifest.schema !== "inspr.hostdash.config.v1") throw new Error("unsupported manifest schema");
  if (manifest.version !== 1) throw new Error("unsupported manifest version");

  const host = objectOr(manifest.host);
  if (typeof host.name !== "string") throw new Error("manifest host.name is required");

  const wings = cleanWings(manifest.wings);
  const services = cleanServices(manifest.services);
  if (!wings.length) throw new Error("manifest wings are required");
  if (!services.length) throw new Error("manifest services are required");

  const slug = stringOr(manifest.slug, host.name);
  return {
    __source: "manifest-json",
    schema: manifest.schema,
    version: manifest.version,
    slug,
    storageKey: stringOr(manifest.storageKey, `hostdash.${slug}`),
    host,
    meta: cleanMeta(manifest.meta),
    palette: objectOr(manifest.palette),
    policy: objectOr(manifest.policy),
    presentation: cleanPresentation(manifest.presentation),
    contact: cleanContact(manifest.contact),
    wings,
    services,
  };
}

async function loadManifestConfig() {
  try {
    const response = await fetch(MANIFEST_URL, { cache: "no-store" });
    if (!response.ok) return null;
    return manifestToConfig(await response.json());
  } catch (error) {
    console.warn(`HostDash manifest ignored: ${error.message}`);
    return null;
  }
}

async function loadHostdashConfig() {
  const fallback = objectOr(FALLBACK_CONFIG);
  const manifestConfig = await loadManifestConfig();
  if (manifestConfig) {
    // A nixcfg-generated manifest carries services, not presentation. The board's own
    // config.js (same package, same slug) still supplies audience, density and contact.
    const sameBoard = !fallback.slug || fallback.slug === manifestConfig.slug;
    return {
      ...manifestConfig,
      presentation: { ...(sameBoard ? cleanPresentation(fallback.presentation) : {}), ...manifestConfig.presentation },
      contact: manifestConfig.contact || (sameBoard ? cleanContact(fallback.contact) : null),
    };
  }
  if (FALLBACK_CONFIG) {
    return {
      __source: "config-js",
      ...FALLBACK_CONFIG,
      presentation: cleanPresentation(fallback.presentation),
      contact: cleanContact(fallback.contact),
    };
  }
  throw new Error("HostDash config.js is missing and no valid manifest.json is available");
}

// ── ACCENT: one per board, contrast-checked in both appearances (WCAG AA) ──────
const ACCENT_PRESETS = {
  blue: { light: { a: "#0066CC", fill: "#0066CC", on: "#FFFFFF" }, dark: { a: "#4BA1FF", fill: "#0A6CD6", on: "#FFFFFF" } },
  graphite: { light: { a: "#48484E", fill: "#3A3A3F", on: "#FFFFFF" }, dark: { a: "#D1D1D6", fill: "#D1D1D6", on: "#1C1C1F" } },
};
const rgbOf = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
const hexOf = rgb => `#${rgb.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("")}`.toUpperCase();
function luminance(hex) {
  const [r, g, b] = rgbOf(hex).map(v => v / 255).map(v => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contrast(a, b) {
  const [x, y] = [luminance(a), luminance(b)].sort((p, q) => q - p);
  return (x + 0.05) / (y + 0.05);
}
function towards(hex, target, minRatio, against) {
  const from = rgbOf(hex);
  const to = rgbOf(target);
  for (let step = 0; step <= 20; step += 1) {
    const mixed = hexOf(from.map((v, i) => v + (to[i] - v) * step / 20));
    if (contrast(mixed, against) >= minRatio) return mixed;
  }
  return target;
}
function accentFor(rawAccent, theme) {
  const name = typeof rawAccent === "string" ? rawAccent.toLowerCase() : "";
  if (ACCENT_PRESETS[name]) return { ...ACCENT_PRESETS[name][theme], preset: name };
  const hex = isHex(rawAccent) ? rawAccent.toUpperCase() : ACCENT_PRESETS.blue.light.a;
  if (theme === "dark") {
    return {
      a: towards(hex, "#FFFFFF", 4.6, "#2C2C31"),
      fill: towards(hex, "#000000", 4.6, "#FFFFFF"),
      on: "#FFFFFF",
    };
  }
  const a = towards(hex, "#000000", 4.6, "#ECECF0");
  return { a, fill: a, on: "#FFFFFF" };
}

// ── HOST TRUTH (HOSTD-7 / NIX-280 / HOSTD-11) ─────────────────────────────────
//
// `running` cannot be known client-side, ever, and neither can a status code: a no-cors
// fetch resolves on a 500 exactly as on a 200. So the host writes status.json and nginx
// serves it SAME-ORIGIN, which is what makes it readable at all. It is re-read on every
// sweep, never once at load: this board's job is to be left open for days.
const STATUS_URL = window.HOSTDASH_STATUS_URL || "./status/status.json";
const STATUS_PATH = "./status/status.json";
// The artifact refreshes every 60 s. Anything older is not evidence, never "healthy".
const STATUS_MAX_AGE_MS = 5 * 60 * 1000;
// The board re-reads host truth and re-probes about once a minute, jittered so a rack of
// open dashboards does not stampede the host in lockstep. Overridable for tests.
const SWEEP_MS = Number(window.HOSTDASH_SWEEP_MS) || 55000 + Math.random() * 10000;

let HOST_STATUS = null;
let TRUTH = { state: "checking", key: "checkingSource" }; // "live" | "stale" | "none" | "checking"
let lastGoodArtifact = null;
let lastTruthWarning = "";

async function readHostStatus() {
  // Bounded: a half-open connection must not stall every later sweep on old states.
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 4000);
  try {
    const response = await fetch(STATUS_URL, { cache: "no-store", signal: controller.signal });
    if (!response.ok) {
      lastGoodArtifact = null;
      return { state: "none", key: "noArtifact" };
    }
    const data = await response.json();
    const verdict = EvidenceCore.judgeArtifact(data, Date.now(), STATUS_MAX_AGE_MS);
    lastGoodArtifact = verdict.state === "live" ? data : null;
    return verdict.state === "live" ? { ...verdict, data } : verdict;
  } catch {
    // A transient read failure is not news about the host. The last good artifact stays
    // evidence exactly as long as its own age allows, then it is dropped like any other:
    // no flicker to "no evidence" and back on a single dropped request.
    if (lastGoodArtifact) {
      const verdict = EvidenceCore.judgeArtifact(lastGoodArtifact, Date.now(), STATUS_MAX_AGE_MS);
      if (verdict.state === "live") return { ...verdict, data: lastGoodArtifact, retained: true };
      lastGoodArtifact = null;
      return verdict;
    }
    return { state: "none", key: "probesOnly" };
  } finally {
    clearTimeout(timeout);
  }
}

function fmtAge(sec) {
  const value = Math.max(0, Math.round(sec));
  if (value < 90) return t("ageSeconds", { n: value });
  if (value < 5400) return t("ageMinutes", { n: Math.round(value / 60) });
  return t("ageHours", { n: Math.round(value / 3600) });
}

const truthAgeSec = () => TRUTH.generated ? Math.max(0, Date.now() / 1000 - TRUTH.generated) : (TRUTH.ageSec || 0);

// ── BOARD ─────────────────────────────────────────────────────────────────────
let CONFIG;
try {
  CONFIG = await loadHostdashConfig();
} catch (error) {
  document.getElementById("hero").innerHTML = `<div class="hero-in"><div class="hero-main"><span class="lens" aria-hidden="true"><span class="led" data-l="off"></span></span><div class="hero-txt"><h2 class="hero-h" id="heroH">${esc(t("configMissing"))}</h2><p class="hero-sub">${esc(error.message)}</p></div></div></div>`;
  throw error;
}
document.documentElement.dataset.configSource = CONFIG.__source || "unknown";

const PRESENTATION = objectOr(CONFIG.presentation);
const CONTACT = CONFIG.contact || null;
const AUDIENCE = PRESENTATION.audience || "operator";
const PALETTE = objectOr(CONFIG.palette);
const RAW_ACCENT = PALETTE.accent || objectOr(PALETTE.gradient).primary || "blue";
const WINGS = arrayOrEmpty(CONFIG.wings);
const storagePrefix = CONFIG.storageKey || `hostdash.${CONFIG.host?.name || "host"}`;
const wingKey = `${storagePrefix}.wing`;
const zoomKey = `${storagePrefix}.zoom`;
const zoomModeKey = `${storagePrefix}.zoomMode`;
const densityKey = `${storagePrefix}.density`;
document.documentElement.dataset.audience = AUDIENCE;
if (isHex(RAW_ACCENT)) document.documentElement.style.setProperty("--manifest-accent", RAW_ACCENT);

const SERVICES = arrayOrEmpty(CONFIG.services)
  .filter(raw => isObject(raw) && WINGS.some(wing => wing.id === raw.wing))
  .map((raw, index) => {
    const active = raw.passive !== true;
    const url = EvidenceCore.resolveTarget(raw, window.location.href);
    return { raw, index, key: `s${index}`, wing: raw.wing, active, url, model: EvidenceCore.serviceModel(raw, url) };
  });
const BY_KEY = new Map(SERVICES.map(service => [service.key, service]));
const WINGS_USED = WINGS.filter(wing => SERVICES.some(service => service.wing === wing.id));
const EV = new Map();

const prober = EvidenceCore.createProber({
  fetchImpl: (url, options) => fetch(url, options),
  schedule: (fn, ms) => setTimeout(fn, ms),
  cancel: id => clearTimeout(id),
  makeController: () => new AbortController(),
  onSettle: key => {
    refresh(BY_KEY.get(key));
    scheduleSummary();
  },
});

function refresh(service) {
  if (!service) return;
  EV.set(service.key, EvidenceCore.derive(service.model, { truth: TRUTH.state, status: HOST_STATUS, probe: prober.result(service.key) }));
  paintItem(service);
}

const nameOf = service => localize(service.raw.name);
const purposeOf = service => localize(service.raw.purpose);
const footOf = service => localize(service.active ? service.raw.port || service.raw.path : service.raw.foot);
const wingOf = service => WINGS.find(wing => wing.id === service.wing);
const isBad = ev => ev?.l === "bad";
const isAway = ev => ev?.l === "split" || ev?.l === "aring";
// "Opens" needs this browser's own reachability evidence; a host-only green gets
// running wording instead (EvidenceCore.opens, HOSTD-83 gate r2).
const opensFine = ev => EvidenceCore.opens(ev);
const runsPerHost = ev => EvidenceCore.runsPerHost(ev);
const wordOf = ev => ev?.word ? t(ev.word, ev.vars) : "";
const contactName = () => CONTACT ? localize(CONTACT.name) : "";

function whenWord(epochSec) {
  const date = new Date(epochSec * 1000);
  const time = date.toLocaleTimeString(language === "de" ? "de-AT" : "en-GB", { hour: "2-digit", minute: "2-digit" });
  const day = new Date();
  day.setHours(0, 0, 0, 0);
  if (date >= day) return `${t("today")} ${time}`;
  const yesterday = new Date(day);
  yesterday.setDate(yesterday.getDate() - 1);
  if (date >= yesterday) return `${t("yesterday")} ${time}`;
  return `${date.toLocaleDateString(language === "de" ? "de-AT" : "en-GB", { weekday: "short", day: "numeric", month: "short" })} ${time}`;
}

function evText(ev) {
  return (ev?.ev || []).map(item => {
    if ((item.key === "ev_jobFailed" || item.key === "ev_jobOk") && !item.vars?.last) return t(`${item.key}Undated`);
    const vars = item.vars?.last ? { ...item.vars, when: whenWord(item.vars.last) } : item.vars;
    return t(item.key, vars);
  }).join(" · ");
}

function srStateOf(ev) {
  return ev?.word ? t("srState", { word: wordOf(ev), src: t(`src_${ev.src || "host"}`) }) : t("srNone");
}

// ── SERVICES: tiles or list, built per density and language, patched per evidence ──
let density = (() => {
  const stored = store.get(densityKey);
  if (stored === "tiles" || stored === "list") return stored;
  return PRESENTATION.density || (AUDIENCE === "family" ? "tiles" : "list");
})();
let filter = store.get(wingKey) || "all";
let query = "";

const hayOf = service => [nameOf(service), purposeOf(service), footOf(service), localize(wingOf(service)?.name),
  service.raw.container, service.raw.unit, localize(service.raw.note)].filter(Boolean).join(" ").toLowerCase();

function itemAttrs(service) {
  const { raw, model } = service;
  return [
    `data-item="${service.key}"`, `data-wing="${esc(service.wing)}"`, `data-hay="${esc(hayOf(service))}"`,
    raw.container ? `data-container="${esc(raw.container)}"` : "",
    raw.unit ? `data-unit="${esc(raw.unit)}"` : "",
    raw.extra ? `data-extra="${esc(raw.extra)}"` : "",
    model.probeUrl ? `data-probe="${esc(model.probeUrl)}"` : "",
    model.staticState ? `data-static="${esc(model.staticState)}"` : "",
    raw.certIssue === true ? 'data-cert-issue="1"' : "",
    service.active ? "" : 'data-passive="1"',
    `style="--i:${service.index};--b:${Math.floor(service.index / 5)}"`,
  ].filter(Boolean).join(" ");
}

function tileHTML(service) {
  const name = nameOf(service);
  const linkAttrs = service.url ? `href="${esc(service.url)}" target="_blank" rel="noopener" aria-describedby="p-${service.key}"` : "";
  const inner = `<span class="t-head"><span class="app-ic">${icon(service.raw.icon)}</span><span class="t-ht"><span class="t-name" data-name="${esc(name)}">${esc(name)}</span><span class="t-st"><span class="led" data-l="off" aria-hidden="true"></span><span class="t-word"></span></span></span></span>
      <span class="t-purpose" id="p-${service.key}">${esc(purposeOf(service))}</span><span class="t-ev" hidden></span>
      <span class="t-foot"><span class="t-code" title="${esc(footOf(service))}">${esc(footOf(service) || t("noUi"))}</span>${service.active ? `<span class="t-open"><span class="t-open-l">${esc(t("open"))}</span>${icon("arrow-ur")}</span>` : ""}</span>`;
  return service.active
    ? `<a class="tile" ${linkAttrs} ${itemAttrs(service)}>${inner}</a>`
    : `<div class="tile passive" tabindex="-1" role="group" ${itemAttrs(service)}>${inner}</div>`;
}

function rowHTML(service) {
  const name = nameOf(service);
  const inner = `<span class="led" data-l="off" aria-hidden="true"></span><span class="r-ic">${icon(service.raw.icon)}</span>
    <span class="r-name" data-name="${esc(name)}">${esc(name)}</span><span class="r-purpose">${esc(purposeOf(service))}</span>
    <span class="badge" hidden></span><span class="r-foot">${esc(footOf(service))}</span>${service.active ? `<span class="r-go">${icon("arrow-ur")}</span>` : '<span class="r-nogo"></span>'}`;
  return `<li class="row-li" ${itemAttrs(service)}>${service.active
    ? `<a class="row"${service.url ? ` href="${esc(service.url)}" target="_blank" rel="noopener"` : ""}>${inner}</a>`
    : `<div class="row" tabindex="-1" role="group">${inner}</div>`}</li>`;
}

const itemOf = service => document.querySelector(`#services [data-item="${service.key}"]`);
const focusTargetOf = item => item ? (item.matches("a,[tabindex]") ? item : item.querySelector("a,[tabindex]")) : null;

function renderServices() {
  const host = $("#services");
  const activeKey = document.activeElement?.closest?.("#services [data-item]")?.dataset.item || null;
  document.documentElement.dataset.density = density;
  $$("[data-density]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.density === density)));
  if (!SERVICES.length) {
    host.innerHTML = `<div class="blank ghost"><span class="app-ic">${icon("plus")}</span><p>${esc(t(AUDIENCE === "family" ? "blankF" : "blankO"))}</p></div>`;
    return;
  }
  const head = (wing, n) => `<h3 class="wing-h"><span class="wt">${esc(localize(wing.name))}</span> <span class="wn">${n}</span></h3>`;
  host.innerHTML = density === "list"
    ? `<div class="list">${WINGS_USED.map(wing => {
      const items = SERVICES.filter(service => service.wing === wing.id);
      return `<section class="wing" data-wingbox="${esc(wing.id)}">${head(wing, items.length)}<div class="wcard"><ul class="rows">${items.map(rowHTML).join("")}</ul></div></section>`;
    }).join("")}</div>`
    : `<div class="tiles">${WINGS_USED.map(wing => {
      const items = SERVICES.filter(service => service.wing === wing.id);
      return `<section class="wing" data-wingbox="${esc(wing.id)}" style="--n:${items.length}">${head(wing, items.length)}<div class="wing-grid">${items.map(tileHTML).join("")}</div></section>`;
    }).join("")}</div>`;
  SERVICES.forEach(paintItem);
  if (activeKey) focusTargetOf(itemOf(BY_KEY.get(activeKey)))?.focus({ preventScroll: true });
}

function paintItem(service) {
  const item = itemOf(service);
  const ev = EV.get(service.key);
  if (!item || !ev) return;
  const word = wordOf(ev);
  const evidence = evText(ev);
  const name = nameOf(service);
  const pending = prober.pending(service.key);
  item.dataset.s = ev.s;
  item.dataset.l = ev.l;
  item.dataset.bad = isBad(ev) ? "1" : "0";
  item.dataset.word = word;
  if (ev.hostOk) item.dataset.hostOk = String(ev.hostOk);
  else delete item.dataset.hostOk;
  if (pending) item.setAttribute("aria-busy", "true");
  else item.removeAttribute("aria-busy");
  if (prober.result(service.key)) item.dataset.probed = "1";
  item.querySelectorAll(".led").forEach(led => { led.dataset.l = ev.l; });
  const note = localize(service.raw.note);
  const title = [ev.hostOk ? t("hostOkExplanation", { code: ev.hostOk }) : "", evidence, note].filter(Boolean).join(" · ");
  const label = `${service.active ? t("srOpen", { name }) : name}. ${srStateOf(ev)}.`;
  const tileWord = item.querySelector(".t-word");
  if (tileWord) {
    tileWord.textContent = word;
    const evLine = item.querySelector(".t-ev");
    evLine.hidden = !(isBad(ev) && AUDIENCE !== "family");
    evLine.textContent = evLine.hidden ? "" : evidence;
    const open = item.querySelector(".t-open-l");
    if (open) open.textContent = t(isBad(ev) ? "openAnyway" : "open");
    item.title = title;
    item.setAttribute("aria-label", label);
  }
  const badge = item.querySelector(".badge");
  if (badge) {
    const exceptional = isBad(ev) || isAway(ev) || ev.s === "muted";
    badge.hidden = !exceptional;
    badge.className = `badge ${isBad(ev) ? "bad" : ev.s === "muted" ? "calm" : "warn"}`;
    badge.textContent = exceptional ? word : "";
    const row = item.querySelector(".row");
    row.title = [name, purposeOf(service), word, title].filter(Boolean).join(" · ");
    row.setAttribute("aria-label", `${label} ${purposeOf(service)}`);
  }
  const panelLed = document.querySelector(`#hero .panel .led[data-key="${service.key}"]`);
  if (panelLed) {
    panelLed.dataset.l = ev.l;
    panelLed.title = `${name}${word ? ` · ${word}` : ""}`;
  }
}

// ── SUMMARY: hero verdict, rail counts, favicon ───────────────────────────────
function summarize() {
  const list = SERVICES.map(service => ({ service, ev: EV.get(service.key) }));
  const verdict = EvidenceCore.aggregate(list.map(item => item.ev), TRUTH.state);
  const pick = indexes => indexes.map(i => list[i]);
  return {
    list, v: verdict.v, lens: verdict.lens, n: verdict.n, family: AUDIENCE === "family",
    bad: pick(verdict.bad), away: pick(verdict.away), vouched: pick(verdict.vouched),
    running: pick(verdict.running), jobs: pick(verdict.jobs),
    reached: pick(verdict.reached), pending: pick(verdict.pending), none: pick(verdict.none),
  };
}

const joinNames = names => {
  const and = language === "de" ? " und " : " and ";
  return names.length <= 1 ? (names[0] || "") : `${names.slice(0, -1).join(", ")}${and}${names[names.length - 1]}`;
};
const openersOf = m => m.list.filter(item => item.service.active && opensFine(item.ev)).map(item => nameOf(item.service));
const runnersOf = m => m.list.filter(item => item.service.active && runsPerHost(item.ev)).map(item => nameOf(item.service));
const listPart = (names, one, many) => names.length ? t(names.length > 1 ? many : one, { list: joinNames(names) }) : "";
const lensOf = m => m.lens || "off";

function headline(m) {
  const f = m.family;
  switch (m.v) {
    case "empty": return esc(t(f ? "h_emptyF" : "h_emptyO"));
    case "checking": return esc(t("h_checking"));
    case "bad": {
      if (!f) return esc(t("h_badOp", { b: m.bad.length, n: m.n }));
      if (m.bad.length > 1) return esc(t("h_badMany", { b: m.bad.length }));
      const [{ service, ev }] = m.bad;
      return esc(ev.s === "stopped" || ev.s === "down"
        ? t("h_bad1Stopped", { name: nameOf(service) })
        : t("h_bad1Fault", { name: nameOf(service), word: wordOf(ev) }));
    }
    case "notice": {
      const one = m.away.length === 1 ? nameOf(m.away[0].service) : "";
      if (!f) return esc(one ? t("h_awayOp1", { name: one }) : t("h_awayOpMany", { a: m.away.length }));
      return esc(one ? t("h_away1", { name: one }) : t("h_awayMany", { a: m.away.length }));
    }
    case "quiet":
      if (TRUTH.state === "stale") return f ? esc(t("h_staleF", { m: "\u0000" })).replace("\u0000", '<span data-live="staleMin"></span>')
        : esc(t("h_staleO", { age: "\u0000" })).replace("\u0000", '<span data-live="staleAge"></span>');
      if (f) return esc(t("h_noneF"));
      return esc(t(TRUTH.key === "unknownSchema" ? "h_schemaO" : TRUTH.key === "probesOnly" ? "h_unreadableO" : TRUTH.key === "badTime" ? "h_timeO" : "h_noneO"));
    // Running counts only what runs; a job whose last run was ok is said as such.
    case "partial": return esc(m.vouched.length ? t("h_partial", { ok: m.running.length, n: m.n }) : t("h_noVouch", { n: m.n }));
    default:
      if (m.jobs.length) return esc(m.n === 1 ? t("h_okJobOne") : t("h_okJobs", { n: m.n, r: m.running.length, j: m.jobs.length }));
      return esc(m.n === 1 ? t("h_okOne") : t("h_okMany", { n: m.n }));
  }
}

function subline(m) {
  const f = m.family;
  const urls = m.list.filter(item => item.service.model.probeUrl).length;
  switch (m.v) {
    case "empty": return t(f ? "s_emptyF" : "s_emptyO");
    case "checking": return t("s_checking");
    case "bad": return f ? t("s_badF", { u: m.running.length + m.away.filter(item => item.ev.l === "split").length, n: m.n }) : "";
    case "notice": {
      const hostVouched = m.away.every(item => item.ev.l === "split");
      if (!hostVouched) return t(f ? "s_awayOnlyF" : "s_awayOnlyO");
      return f ? t(m.away.length > 1 ? "s_awayHostFMany" : "s_awayHostF") : t("s_awayHostO");
    }
    case "quiet":
      if (f) return t("s_quietF");
      if (TRUTH.state === "stale") return t("s_staleO", { u: urls });
      return t("s_noneO", { path: STATUS_PATH, why: t(`why_${TRUTH.key}`), u: urls });
    case "partial": {
      const part = (items, one, many) => {
        if (!items.length) return "";
        const names = items.map(item => nameOf(item.service));
        return names.length <= 3 ? t(one, { list: joinNames(names) }) : t(many, { k: names.length });
      };
      return [part(m.jobs, "s_jobs", "s_jobsMany"), part(m.reached, "s_reached", "s_reachedMany"), part(m.none, "s_partial", "s_partialMany")].filter(Boolean).join(" ");
    }
    default: {
      if (!f) {
        const vouched = m.list.filter(item => item.ev.src === "host" || item.ev.src === "both" || item.ev.src === "self").length;
        return t("s_okO", { h: vouched, u: urls, w: WINGS_USED.length });
      }
      // "Opens" only where this browser reached it; the host's word alone is running.
      return [listPart(openersOf(m), "s_okFOne", "s_okFMany"), listPart(runnersOf(m), "s_runFOne", "s_runFMany")].filter(Boolean).join(" ");
    }
  }
}

function truthTitle() {

function guideHTML(m) {
  if (!m.family || !["bad", "notice", "quiet", "empty"].includes(m.v)) return "";

  const okOpeners = openersOf(m);
  const urls = m.list.filter(item => item.service.active).length;
  const steps = [];

  if (m.v === "bad") {
    if (okOpeners.length) steps.push(okOpeners.length === urls ? t("g_allOpen") : t(okOpeners.length > 1 ? "g_othersMany" : "g_othersOne", { list: joinNames(okOpeners) }));
    const runners = runnersOf(m);
    if (runners.length) steps.push(listPart(runners, "g_runOne", "g_runMany"));
    steps.push(who ? t("g_tell", { name: who }) : t("g_tellNeutral"));
    steps.push(t("g_auto"));
    actions = button("reload", t("reload"), "reload", { cls: "primary" });
  } else if (m.v === "notice") {
    steps.push(t("g_retry"), t("g_wifi"), who ? t("g_still", { name: who }) : t("g_stillNeutral"));

  } else if (m.v === "quiet") {

// A background refresh must never drop keyboard focus to <body> (HOSTD-83 gate r1).
// When the focused control is gone (its service recovered), focus moves to the nearest
// stable thing: the service an attention chip pointed at, else the hero heading.
function refocusHero(fk) {
  const same = fk ? $(`#hero [data-fk="${CSS.escape(fk)}"]`) : null;
  if (same) return same.focus({ preventScroll: true });
  const service = fk && fk.startsWith("att-") ? BY_KEY.get(fk.slice(4)) : null;
  const target = service ? focusTargetOf(itemOf(service)) : null;
  if (target && target.getClientRects().length) return target.focus({ preventScroll: true });
  $("#heroH")?.focus({ preventScroll: true });
}

function renderRail(m) {
  const host = $("#groups");
  if (!m.n) { host.innerHTML = ""; return; }
  if (filter === "problems" && !m.bad.length) filter = "all";
  if (filter !== "all" && filter !== "problems" && !WINGS_USED.some(wing => wing.id === filter)) filter = "all";
  const group = (id, label, n, iconName, cls = "", led = false) =>
    `<button type="button" class="grp${cls}" data-wing="${esc(id)}" data-fk="wing-${esc(id)}" aria-pressed="${filter === id}">${icon(iconName)}<span class="gn">${esc(label)}</span><span class="gc">${led ? '<span class="led" data-l="bad" aria-hidden="true"></span>' : ""}<span class="n">${n}</span></span></button>`;
  const html = group("all", t("all"), m.n, "tiles") +
    (m.bad.length ? group("problems", t("problems"), m.bad.length, "shield-alert", " bad") : "") +
    WINGS_USED.map(wing => {
      const items = m.list.filter(item => item.service.wing === wing.id);
      const bad = items.some(item => isBad(item.ev));
      return group(wing.id, localize(wing.name), items.length, wing.icon, bad ? " has-bad" : "", bad);

}

const mqDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
const mqReduce = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
const reducedMotion = () => Boolean(mqReduce?.matches);
// The chosen appearance lives in memory and is persisted opportunistically. HOSTD-83
// gate r1: re-reading a blocked store on every click fell back to the system setting,
// so light → dark → dark.
const validTheme = value => value === "dark" || value === "light";
let themeChoice = validTheme(store.get(THEME_KEY)) ? store.get(THEME_KEY) : null;
const currentTheme = () => themeChoice || (mqDark?.matches ? "dark" : "light");

function applyTheme(theme = currentTheme()) {
  const root = document.documentElement;
  const accent = accentFor(RAW_ACCENT, theme);
  root.dataset.theme = theme;
  if (accent.preset) root.dataset.accent = accent.preset;
  else delete root.dataset.accent;
  root.style.setProperty("--accent", accent.a);
  root.style.setProperty("--accent-fill", accent.fill);
  root.style.setProperty("--on-accent", accent.on);
  const sw = $("#themeSwitch");
  sw.setAttribute("aria-checked", String(theme === "dark"));
  $("#themeKnob").innerHTML = icon(theme === "dark" ? "moon" : "sun");
}

// ── FILTER, SEARCH, ZOOM ─────────────────────────────────────────────────────
const search = $("#q");
const zoomRange = $("#zoomRange");
const zoomValue = $("#zoomValue");
const markName = (name, term) => {
  const at = term ? name.toLowerCase().indexOf(term) : -1;
  return at < 0 ? esc(name) : `${esc(name.slice(0, at))}<mark>${esc(name.slice(at, at + term.length))}</mark>${esc(name.slice(at + term.length))}`;
};

function applyFilter() {
  if (!SERVICES.length) return;
  const term = query.trim().toLowerCase();
  const seen = new Set();
  $$("#services [data-item]").forEach(item => {
    const inWing = filter === "all" || (filter === "problems" ? item.dataset.bad === "1" : item.dataset.wing === filter);
    const on = inWing && (!term || item.dataset.hay.includes(term));
    item.hidden = !on;
    if (on) seen.add(item.dataset.item);
    const nameNode = item.querySelector("[data-name]");
    if (nameNode) nameNode.innerHTML = markName(nameNode.dataset.name, term);
  });
  $$("#services [data-wingbox]").forEach(box => {
    const visible = box.querySelectorAll("[data-item]:not([hidden])").length;
    box.hidden = !visible;
    box.style.setProperty("--n", String(Math.max(1, visible)));
  });
  const filtered = Boolean(term) || filter !== "all";
  $$("#hero .panel .led").forEach(led => led.classList.toggle("is-sel", filtered && seen.has(led.dataset.key)));
  $$("#groups .grp").forEach(group => group.setAttribute("aria-pressed", String(group.dataset.wing === filter)));
  const count = $("#count");
  const countHtml = filtered ? `${esc(t("count", { a: seen.size, b: SERVICES.length }))} · <button type="button" data-act="clear" data-fk="clear">${esc(t("clear"))}</button>` : "";
  if (count.dataset.cache !== countHtml) {
    const refocus = count.contains(document.activeElement);
    count.dataset.cache = countHtml;
    count.innerHTML = countHtml;
    if (refocus) count.querySelector("button")?.focus({ preventScroll: true });
  }
  const empty = $("#empty");
  empty.hidden = seen.size > 0;
  const emptyHtml = seen.size ? "" : `<div class="blank"><span class="app-ic">${icon("search")}</span><p>${esc(term ? t("noMatch", { q: query.trim() }) : t("noneInFilter"))}</p>${button("clear", t("clear"), "", { cls: "tinted", fk: "blank" })}</div>`;
  if (empty.dataset.cache !== emptyHtml) {
    empty.dataset.cache = emptyHtml;
    empty.innerHTML = emptyHtml;
  }
}

function setFilter(next) {
  filter = next;
  store.set(wingKey, next);
  applyFilter();
}

function setQuery(next) {
  query = next;
  if (search.value !== next) search.value = next;
  applyFilter();
}

const clampZoom = value => Math.max(50, Math.min(200, Math.round(Number(value) / 5) * 5 || 100));
let zoomMode = store.get(zoomModeKey) === "fit" ? "fit" : "manual";

function setZoom(value, mode = "manual") {
  const next = clampZoom(value);
  zoomMode = mode;
  document.documentElement.style.setProperty("--zoom", String(next / 100));
  zoomRange.value = String(next);
  zoomRange.style.setProperty("--p", `${((next - 50) / 150 * 100).toFixed(1)}%`);
  zoomRange.setAttribute("aria-valuetext", `${next} %`);
  zoomValue.value = `${next} %`;
  zoomValue.textContent = `${next} %`;
  $("#zoomOut").disabled = next <= 50;
  $("#zoomIn").disabled = next >= 200;
  $("#zoomFit").setAttribute("aria-pressed", String(mode === "fit"));
  store.set(zoomKey, String(next));
  store.set(zoomModeKey, mode);
}

// Fit all services: the largest step at which the whole board fits the window. Resets
// filter and search, and follows the window size until zoom is set by hand.
function fitAll(reset = true) {
  if (!SERVICES.length) return;
  if (reset) {
    filter = "all";
    store.set(wingKey, filter);
    setQuery("");
    window.scrollTo(0, 0);
  }
  const wrap = $("#zoomwrap");
  const root = document.documentElement;
  let best = 50;
  for (let z = 100; z >= 50; z -= 5) {
    root.style.setProperty("--zoom", String(z / 100));
    const bottom = wrap.getBoundingClientRect().bottom + window.scrollY;
    if (bottom <= window.innerHeight - 12 && root.scrollWidth <= root.clientWidth) { best = z; break; }
  }
  setZoom(best, "fit");
}

function jumpTo(key) {
  if (query || filter !== "all") {
    filter = "all";
    store.set(wingKey, filter);
    setQuery("");
  }
  const item = itemOf(BY_KEY.get(key));
  const target = focusTargetOf(item);
  if (!target) return;
  item.scrollIntoView({ block: "center", behavior: reducedMotion() ? "auto" : "smooth" });
  target.focus({ preventScroll: true });
  target.classList.remove("is-pinged");
  void target.offsetWidth;
  target.classList.add("is-pinged");
  setTimeout(() => target.classList.remove("is-pinged"), 1900);
}

// ── SWEEP AND CLOCK ──────────────────────────────────────────────────────────
let sweepTimer = 0;
let sweepRunning = false;
let lastSweepAt = 0;
let nextSweepAt = 0;
let sweepAnimTimer = 0;

async function sweep() {
  clearTimeout(sweepTimer);
  lastSweepAt = Date.now();
  nextSweepAt = lastSweepAt + SWEEP_MS;
  sweepTimer = setTimeout(sweep, SWEEP_MS);
  if (sweepRunning) return;
  sweepRunning = true;
  const root = document.documentElement;
  if (!reducedMotion()) {
    root.classList.remove("is-sweeping");
    void root.offsetWidth;
    root.classList.add("is-sweeping");
    clearTimeout(sweepAnimTimer);
    sweepAnimTimer = setTimeout(() => root.classList.remove("is-sweeping"), 1100);
  }
  try {
    // Host truth first, every time; probes only refine it.
    const verdict = await readHostStatus();
    TRUTH = verdict;
    HOST_STATUS = verdict.state === "live" ? verdict.data : null;
    root.dataset.hostTruth = HOST_STATUS ? "live" : "absent";
    const warning = verdict.state === "stale" ? "stale" : "";
    if (warning && warning !== lastTruthWarning) console.warn(`[hostdash] status artifact is stale (${verdict.ageSec}s) — ignoring`);
    lastTruthWarning = warning;
    SERVICES.forEach(service => {
      if (service.model.probeUrl) prober.request(service.key, service.model.probeUrl);
      refresh(service);
    });
    renderSummary();
  } finally {
    sweepRunning = false;
  }
}

function setLive(key, value) {
  $$(`[data-live="${key}"]`).forEach(node => { if (node.textContent !== value) node.textContent = value; });
}

function liveValues() {
  const now = Date.now();
  if (TRUTH.state === "live") {
    setLive("age", t("tr_ago", { age: fmtAge(truthAgeSec()) }));
    const left = Math.max(0, Math.ceil((nextSweepAt - now) / 1000));
    setLive("next", sweepRunning ? t("tr_now") : t("tr_next", { s: left }));
    const arc = $("#hero .cd .arc");
    if (arc) {
      const span = Math.max(1, nextSweepAt - lastSweepAt);
      arc.setAttribute("stroke-dasharray", `${Math.min(100, Math.max(1, (now - lastSweepAt) / span * 100)).toFixed(1)} 100`);
    }
  } else if (TRUTH.state === "stale") {
    const age = truthAgeSec();
    setLive("staleChip", t("tr_stale", { age: fmtAge(age) }));
    setLive("staleAge", fmtAge(age));
    setLive("staleMin", String(Math.floor(age / 60)));
  }
}

function tick() {
  const now = new Date();
  const locale = language === "de" ? "de-AT" : "en-GB";
  const time = now.toLocaleTimeString(locale, { hour: "2-digit", minute: "2-digit" });
  const date = now.toLocaleDateString(locale, { weekday: "long", day: "numeric", month: "long" });
  if ($("#clockTime").textContent !== time) $("#clockTime").textContent = time;
  if ($("#clockDate").textContent !== date) $("#clockDate").textContent = date;
  liveValues();
  // A retained artifact ages out on its own clock, not only on the next sweep.
  if (TRUTH.state === "live" && truthAgeSec() * 1000 > STATUS_MAX_AGE_MS && !sweepRunning) sweep();
}

// ── LANGUAGE ─────────────────────────────────────────────────────────────────
function renderLanguage() {
  document.documentElement.lang = language;
  renderChrome();
  renderHost();
  renderServices();
  renderFoot();
  heroCache = "";
  $("#groups").dataset.cache = "";
  renderSummary();
  tick();
}

function switchLanguage(next, persist = false) {
  if (!validLanguage(next)) return;
  if (persist) store.set(LANGUAGE_KEY, next);
  language = next;
  renderLanguage();
}

// ── EVENTS ───────────────────────────────────────────────────────────────────
$$("[data-language]").forEach(control => {
  control.addEventListener("click", () => switchLanguage(control.dataset.language, true));
});
window.addEventListener("storage", event => {
  if ((event.key === LANGUAGE_KEY || event.key === null) &&
      (!event.storageArea || event.storageArea === localStorage)) {
    switchLanguage(validLanguage(event.newValue) ? event.newValue : browserLanguage());
  }
  if ((event.key === THEME_KEY || event.key === null) && (!event.storageArea || event.storageArea === localStorage)) {
    themeChoice = validTheme(event.newValue) ? event.newValue : null;
    applyTheme();
  }
});
$("#themeSwitch").addEventListener("click", () => {
  themeChoice = currentTheme() === "dark" ? "light" : "dark";
  store.set(THEME_KEY, themeChoice);
  applyTheme(themeChoice);
});
mqDark?.addEventListener?.("change", () => { if (!themeChoice) applyTheme(); });

$$("[data-density]").forEach(control => control.addEventListener("click", () => {
  if (control.dataset.density === density) return;
  const run = () => {
    density = control.dataset.density;
    store.set(densityKey, density);
    renderServices();
    applyFilter();
    if (zoomMode === "fit") fitAll(false);
  };
  // A transition the browser skips (a hidden tab, or a second switch while one runs)
  // still applies the update but rejects `ready`; that is not an error, so it must not
  // surface as an unhandled rejection in the console.
  if (document.startViewTransition && !reducedMotion() && !document.hidden) {
    document.startViewTransition(run).ready.catch(() => { /* skipped: nothing to animate */ });
  } else run();
}));

$("#viewToggle").addEventListener("click", event => {
  const open = !$("#viewSec").classList.contains("is-open");
  $("#viewSec").classList.toggle("is-open", open);
  event.currentTarget.setAttribute("aria-expanded", String(open));
});

zoomRange.addEventListener("input", () => setZoom(zoomRange.value));
$("#zoomOut").addEventListener("click", () => setZoom(Number(zoomRange.value) - 5));
$("#zoomIn").addEventListener("click", () => setZoom(Number(zoomRange.value) + 5));
$("#zoomReset").addEventListener("click", () => setZoom(100));
$("#zoomFit").addEventListener("click", () => fitAll(true));
let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (zoomMode === "fit") fitAll(false); }, 160);
});

search.addEventListener("input", () => { query = search.value; applyFilter(); });

document.addEventListener("click", event => {
  const led = event.target.closest?.("#hero .panel .led");
  if (led) return jumpTo(led.dataset.key);
  const group = event.target.closest?.("#groups .grp");
  if (group) return setFilter(filter === group.dataset.wing && group.dataset.wing !== "all" ? "all" : group.dataset.wing);
  // An unreachable service explains itself first; modified clicks open as usual.
  const link = event.target.closest?.("#services a[href]");
  if (link && !(event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button)) {
    const service = BY_KEY.get(link.closest("[data-item]")?.dataset.item);
    if (service && isAway(EV.get(service.key))) {
      event.preventDefault();
      return openSheet(service);
    }
  }
  const actor = event.target.closest?.("[data-act]");
  if (!actor) return;
  switch (actor.dataset.act) {
    case "jump": return jumpTo(actor.dataset.key);
    case "clear": filter = "all"; store.set(wingKey, filter); setQuery(""); search.focus(); return;
    case "reload": return window.location.reload();
    case "reloadStatus": return sweep();
    case "retry": closeSheet(); return sweep();
    case "close": return closeSheet();
    case "close-after": setTimeout(closeSheet, 0); return;
  }
});
document.addEventListener("pointerdown", event => {
  const sheet = $("#sheet");
  if (!sheet.hidden && !sheet.contains(event.target) && !event.target.closest?.("#services a[href]")) closeSheet();
});

// The front panel is a map: pointing at or focusing a service lights its LED.
const hot = event => {
  const key = event.target.closest?.("#services [data-item]")?.dataset.item || null;
  $$("#hero .panel .led").forEach(led => led.classList.toggle("is-hot", led.dataset.key === key));
};
document.addEventListener("pointerover", hot);
document.addEventListener("focusin", hot);

const visibleLinks = () => $$("#services [data-item]:not([hidden])").map(focusTargetOf).filter(node => node?.matches("a[href]"));
const navItems = () => $$("#services [data-item]").filter(item => !item.hidden && !item.closest("[hidden]")).map(focusTargetOf).filter(Boolean);

function moveFocus(from, key) {
  const items = navItems();
  const index = items.indexOf(from);
  if (index < 0) return null;
  const domStep = delta => items[index + delta] || null;
  if (density === "list" && (key === "ArrowDown" || key === "ArrowUp")) return domStep(key === "ArrowDown" ? 1 : -1);
  const r0 = from.getBoundingClientRect();
  const cx = r0.left + r0.width / 2;
  const cy = r0.top + r0.height / 2;
  let best = null;
  let score = Infinity;
  items.forEach(node => {
    if (node === from) return;
    const r = node.getBoundingClientRect();
    const dx = r.left + r.width / 2 - cx;
    const dy = r.top + r.height / 2 - cy;
    let primary;
    let secondary;
    if (key === "ArrowDown") { if (dy < r0.height / 2) return; primary = dy; secondary = Math.abs(dx); }
    else if (key === "ArrowUp") { if (-dy < r0.height / 2) return; primary = -dy; secondary = Math.abs(dx); }
    else if (key === "ArrowRight") { if (dx < r0.width / 2 || Math.abs(dy) > r0.height * 1.5) return; primary = dx; secondary = Math.abs(dy); }
    else { if (-dx < r0.width / 2 || Math.abs(dy) > r0.height * 1.5) return; primary = -dx; secondary = Math.abs(dy); }
    const value = primary + secondary * 2;
    if (value < score) { score = value; best = node; }
  });
  return best || domStep(key === "ArrowDown" || key === "ArrowRight" ? 1 : -1);
}

document.addEventListener("keydown", event => {
  const target = event.target;
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName) && target.type !== "range";
  if (event.key === "Escape") {
    if (closeSheet()) return;
    // Esc clears the search; a second Esc leaves it.
    if (target === search) {
      if (search.value) setQuery("");
      else search.blur();
    } else if (query) {
      setQuery("");
    }
    return;
  }
  if (event.key === "/" && !typing && !event.metaKey && !event.ctrlKey && !event.altKey && SERVICES.length) {
    event.preventDefault();
    search.focus();
    search.select();
    return;
  }
  if (target === search) {
    if (event.key === "Enter") {
      const first = visibleLinks()[0];
      if (first) { event.preventDefault(); first.click(); }
    }
    if (event.key === "ArrowDown") {
      const first = navItems()[0];
      if (first) { event.preventDefault(); first.focus(); }
    }
    return;
  }
  if (/^Arrow(Up|Down|Left|Right)$/.test(event.key) && target.closest?.("#services [data-item]")) {
    const next = moveFocus(target, event.key);
    if (next) {
      event.preventDefault();
      next.focus();
      next.scrollIntoView({ block: "nearest" });
    }
  }
});

// ── START ────────────────────────────────────────────────────────────────────
SERVICES.forEach(service => EV.set(service.key, EvidenceCore.derive(service.model, { truth: TRUTH.state, status: null, probe: null })));
applyTheme();
// A same-origin tab may have changed the preference while the manifest was loading.
language = preferredLanguage();
document.documentElement.classList.add("is-first");
renderLanguage();
setZoom(store.get(zoomKey) || 100, zoomMode);
if (zoomMode === "fit") requestAnimationFrame(() => fitAll(false));
setTimeout(() => document.documentElement.classList.remove("is-first"), 1600);
sweep();
setInterval(tick, 1000);
</script>
</body>
</html>
