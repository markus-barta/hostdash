};
const LANGUAGE_KEY = "hostdash.lang";
const validLanguage = value => value === "de" || value === "en";

function browserLanguage() {
  for (const entry of navigator.languages?.length ? navigator.languages : [navigator.language]) {
    const primary = String(entry || "").split("-")[0].toLowerCase();
    if (validLanguage(primary)) return primary;
  }
  return "en";
}

function preferredLanguage() {
  try {
    const stored = localStorage.getItem(LANGUAGE_KEY);
    if (validLanguage(stored)) return stored;
  } catch { /* A blocked preference store still permits browser-language defaults. */ }
  return browserLanguage();
}

let language = preferredLanguage();
document.documentElement.lang = language;

function t(key, vars = {}) {
  const text = STRINGS[language][key] ?? STRINGS.en[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => vars[name] ?? match);
}

function localize(value) {
  if (typeof value === "string") return value;
  if (!value || typeof value !== "object" || Array.isArray(value)) return "";
  return [value[language], value.en, ...Object.values(value)]
    .find(item => typeof item === "string") ?? "";
}

function renderChrome() {
  for (const [attribute, target] of [
    ["data-i18n", null], ["data-i18n-aria", "aria-label"],
    ["data-i18n-title", "title"], ["data-i18n-placeholder", "placeholder"],
  ]) {
    document.querySelectorAll(`[${attribute}]`).forEach(node => {
      const text = t(node.getAttribute(attribute));
      if (target) node.setAttribute(target, text);
      else node.textContent = text;
    });
  }
  document.querySelectorAll("[data-language]").forEach(button => {
    button.setAttribute("aria-pressed", button.dataset.language === language);
  });
}
renderChrome();

const FALLBACK_CONFIG = window.HOSTDASH_CONFIG || null;
const MANIFEST_URL = window.HOSTDASH_MANIFEST_URL || "./manifest.json";

const isObject = value => value && typeof value === "object" && !Array.isArray(value);
const isHex = value => typeof value === "string" && /^#[0-9a-fA-F]{6}$/.test(value);
const objectOr = value => isObject(value) ? value : {};
const arrayOrEmpty = value => Array.isArray(value) ? value : [];
const stringOr = (value, fallback = "") => typeof value === "string" ? value : fallback;
const isLocalizable = value => typeof value === "string" ||
  (isObject(value) && Object.values(value).some(item => typeof item === "string"));
const localizedOr = (value, fallback = "") => isLocalizable(value) ? value : fallback;

function cleanMeta(meta) {
  return arrayOrEmpty(meta)
    .map(item => {
      if (typeof item === "string") return item;
      if (isObject(item) && isLocalizable(item.text)) {
        return { text: item.text, code: item.code === true };
      }
      if (isLocalizable(item)) return item;
      return null;
    })
    .filter(Boolean);
}

function cleanWings(wings) {
  return arrayOrEmpty(wings)
    .filter(wing => isObject(wing) && typeof wing.id === "string" && isLocalizable(wing.name))
    .map(wing => ({
      id: wing.id,
      name: wing.name,
      color: stringOr(wing.color, "var(--home)"),
      icon: stringOr(wing.icon, "server"),
    }));
}

function cleanServices(services) {
  return arrayOrEmpty(services)
    .filter(service => isObject(service) && typeof service.wing === "string" && isLocalizable(service.name))
    .map(service => {
      const rawStatusPolicy = objectOr(service.statusPolicy);
      const statusPolicy = {
        source: stringOr(rawStatusPolicy.source, "hostdash-probe"),
        ...(typeof rawStatusPolicy.staticState === "string" ? { staticState: rawStatusPolicy.staticState } : {}),
      };
      const status = typeof service.status === "string"
        ? service.status
        : statusPolicy.staticState || null;
      const url = typeof service.url === "string" ? service.url : null;
      const probe = typeof service.probe === "boolean" || typeof service.probe === "string"
        ? service.probe
        : null;
      return {
        wing: service.wing,
        name: service.name,
        purpose: localizedOr(service.purpose),
        icon: stringOr(service.icon, "server"),
        urls: objectOr(service.urls),
        sameHost: service.sameHost === true,
        passive: service.passive === true,
        certIssue: service.certIssue === true,
        statusPolicy,
        ...(url ? { url } : {}),
        ...(typeof service.container === "string" ? { container: service.container } : {}),
        ...(typeof service.unit === "string" ? { unit: service.unit } : {}),
        ...(typeof service.extra === "string" ? { extra: service.extra } : {}),
        ...(typeof service.scheme === "string" ? { scheme: service.scheme } : {}),
        ...(typeof service.port === "string" ? { port: service.port } : {}),
        ...(typeof service.hostPort === "string" ? { hostPort: service.hostPort } : {}),
        ...(typeof service.path === "string" ? { path: service.path } : {}),
        ...(typeof service.search === "string" ? { search: service.search } : {}),
        ...(isLocalizable(service.foot) ? { foot: service.foot } : {}),
        ...(status ? { status } : {}),
        ...(probe !== null ? { probe } : {}),
        ...(isLocalizable(service.note) ? { note: service.note } : {}),
      };
    });
}

function manifestToConfig(manifest) {
  if (!isObject(manifest)) throw new Error("manifest is not an object");
  if (manifest.schema !== "inspr.hostdash.config.v1") throw new Error("unsupported manifest schema");
  if (manifest.version !== 1) throw new Error("unsupported manifest version");

  const host = objectOr(manifest.host);
  if (typeof host.name !== "string") throw new Error("manifest host.name is required");

  const wings = cleanWings(manifest.wings);
  const services = cleanServices(manifest.services);
  if (!wings.length) throw new Error("manifest wings are required");
  if (!services.length) throw new Error("manifest services are required");

  const slug = stringOr(manifest.slug, host.name);
  return {
    __source: "manifest-json",
    schema: manifest.schema,
    version: manifest.version,
    slug,
    storageKey: stringOr(manifest.storageKey, `hostdash.${slug}`),
    host,
    meta: cleanMeta(manifest.meta),
    palette: objectOr(manifest.palette),
    policy: objectOr(manifest.policy),
    wings,
    services,
  };
}

async function loadManifestConfig() {
  try {
    const response = await fetch(MANIFEST_URL, { cache: "no-store" });
    if (!response.ok) return null;
    return manifestToConfig(await response.json());
  } catch (error) {
    console.warn(`HostDash manifest ignored: ${error.message}`);
    return null;
  }
}

async function loadHostdashConfig() {
  const manifestConfig = await loadManifestConfig();
  if (manifestConfig) return manifestConfig;
  if (FALLBACK_CONFIG) return { __source: "config-js", ...FALLBACK_CONFIG };
  throw new Error("HostDash config.js is missing and no valid manifest.json is available");
}

function applyPalette(config) {
  const palette = objectOr(config.palette);
  const gradient = objectOr(palette.gradient);
  const accent = palette.accent || gradient.primary;
  if (!isHex(accent)) return;

  const root = document.documentElement;
  root.style.setProperty("--home", accent);
  root.style.setProperty("--manifest-accent", accent);
  if (isHex(gradient.lightest)) root.style.setProperty("--line-strong", gradient.lightest);
}

// ── HOST TRUTH (HOSTD-7 / NIX-280) ───────────────────────────────────────────
//
// Until now the ONLY status signal was a browser `fetch(url, {mode:"no-cors"})`.
// That response is OPAQUE by design: the status code, headers and body cannot be
// read, and `.then()` fires merely because the request did not network-error.
//
// So the dashboard could not distinguish:
//   * HTTP 500                         -> reported "Online"
//   * self-signed cert (Scrypted)      -> reported "Down", while running fine
//   * running, but not on this network -> reported "Down"
//   * no HTTP endpoint at all          -> never checked; 9 of 19 services on hsb1
//
// It answered "can my browser open a socket?" and printed that as "Online". Half
// the board was a state nobody had measured — the same failure as the babycam that
// showed a perfect picture and made no sound (NIX-151). A monitor that reports
// health it cannot verify is worse than none, because it is trusted.
//
// `running` cannot be known client-side. Ever. So the HOST now says so: a generator
// writes status.json (docker ps + systemctl) and nginx serves it SAME-ORIGIN, which
// is what makes it readable at all. Host truth OUTRANKS the browser probe; the probe
// is demoted to what it actually measures — client reachability.
const STATUS_URL = window.HOSTDASH_STATUS_URL || "./status/status.json";

// The artifact refreshes every 60s. Anything older than this is treated as UNKNOWN,
// never as healthy. A dead generator whose last file still says "running" would leave
// the board reading green forever — which is exactly the bug being fixed, reintroduced
// one layer down. Staleness must degrade to honest ignorance.
const STATUS_MAX_AGE_MS = 5 * 60 * 1000;

// How often the board re-reads host truth and re-probes. Jittered so a rack of open
// dashboards does not stampede the host in lockstep. Overridable for tests, same
// convention as HOSTDASH_STATUS_URL above.
const SWEEP_MS = Number(window.HOSTDASH_SWEEP_MS) || 25000 + Math.random() * 10000;

let HOST_STATUS = null;
let TRUTH = { state: "none", key: "checkingSource" }; // "live" | "stale" | "none"

async function loadHostStatus() {
  // Bounded, because this now runs on every sweep rather than once. A same-origin
  // read of a small file should be instant; a half-open connection that never
  // settles would otherwise stall every subsequent sweep and freeze the board on
  // the states it happened to be showing — a new way to display stale data as fact.
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 4000);
  try {
    const response = await fetch(STATUS_URL, { cache: "no-store", signal: controller.signal });
    if (!response.ok) {
      TRUTH = { state: "none", key: "noArtifact" };
      return null;
    }
    const data = await response.json();
    if (data.schema !== "inspr.hostdash.status.v1") {
      TRUTH = { state: "none", key: "unknownSchema" };
      return null;
    }
    const ageSec = Math.max(0, Math.round(Date.now() / 1000 - (Number(data.generated) || 0)));

    // STALE IS NOT HEALTHY. The generator runs every 60s; if the file has gone quiet,
    // the states in it describe a host as it was, not as it is. Serving that as fact
    // would leave the board reading green long after the host stopped answering — the
    // exact bug this ticket exists to remove, reintroduced one layer down. So we drop
    // it entirely and go back to guessing — but we SAY that we are guessing.
    if (ageSec * 1000 > STATUS_MAX_AGE_MS) {
      TRUTH = { state: "stale", key: "staleStatus", ageSec };
      console.warn(`[hostdash] status artifact is stale (${ageSec}s) — ignoring`);
      return null;
    }

    TRUTH = { state: "live", key: "liveStatus", ageSec };
    return data;
  } catch {
    // Absent or unreachable is FINE — we fall back to probe-only and simply know less.
    // Degrading to ignorance is correct. Degrading to green is not.
    TRUTH = { state: "none", key: "probesOnly" };
    return null;
  } finally {
    clearTimeout(timeout);
  }
}

// Re-read host truth and re-render everything derived from it. Called before every
// sweep, NOT once at load (HOSTD-11).
//
// This board's whole job is to be left open — on a wall, on a spare monitor, on a tab
// nobody closes for a fortnight. Reading the artifact once at page load meant every
// "Running" and "Stopped" badge described the host as it was when the tab was opened,
// while the header cheerfully read "host truth · 12s ago" — a timestamp frozen at t=0.
//
// Worse, STATUS_MAX_AGE_MS could never fire. The guard written to stop a dead generator
// showing green forever was itself evaluated exactly once, at the only moment the data
// was guaranteed fresh. The protection existed and could not engage, which is the most
// expensive kind of safety code: it buys confidence and delivers nothing.
async function refreshHostStatus() {
  HOST_STATUS = await loadHostStatus();
  document.documentElement.dataset.hostTruth = HOST_STATUS ? "live" : "absent";
  renderTruth();
}

function fmtAge(sec) {
  if (sec < 90) return t("ageSeconds", { n: sec });
  if (sec < 5400) return t("ageMinutes", { n: Math.round(sec / 60) });
  return t("ageHours", { n: Math.round(sec / 3600) });
}

// HOSTD-81: a missing, unreadable or stale artifact is an operator concern, not news
// for whoever reads the board. The visible line says calmly where the states come from
// ("checked in this browser"); the precise reason (no file, bad schema, 10 min old)
// stays one hover away in the tooltip, after the explanation.
function renderTruth() {
  const row = document.getElementById("truthRow");
  if (!row) return;
  row.dataset.t = TRUTH.state;
  const detail = t(TRUTH.key, { age: fmtAge(TRUTH.ageSec || 0) });
  const settled = TRUTH.key !== "checkingSource";
  setText("truthLabel", TRUTH.state === "live" || !settled ? detail : t("browserChecks"));
  row.title = t(TRUTH.state === "live" ? "liveExplanation" : "missingExplanation") +
    (TRUTH.state !== "live" && settled ? ` (${detail})` : "");
}

// "running" | "stopped" | null (= no host truth for this service; do not guess)
function hostStateFor(service) {
  if (!HOST_STATUS) return null;
  if (service.container) {
    const entry = HOST_STATUS.containers?.[service.container];
    if (!entry) return null;
    return entry.running ? "running" : "stopped";
  }
  if (service.unit) {
    const entry = HOST_STATUS.units?.[service.unit];
    if (!entry) return null;
    return entry.running ? "running" : "stopped";
  }
  return null;
}

const CONFIG = await loadHostdashConfig();
document.documentElement.dataset.configSource = CONFIG.__source || "unknown";
applyPalette(CONFIG);

const WINGS = CONFIG.wings || [];
const SVC = CONFIG.services || [];
const storagePrefix = CONFIG.storageKey || `hostdash.${CONFIG.host?.name || "host"}`;
const wingKey = `${storagePrefix}.wing`;

const el = (tag, className) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  return node;
};

function setText(id, value) {
  const node = document.getElementById(id);
  if (node) node.textContent = value || "";
}

function renderHostInfo() {
  const host = CONFIG.host || {};
  const eyebrow = localize(host.eyebrow) || [host.os, host.fqdn, host.ip].map(localize).filter(Boolean).join(" · ");

  document.title = localize(host.title) || `${localize(host.name) || "HostDash"} · ${localize(host.role) || t("serviceRole")}`;
  setText("hostName", localize(host.name) || "HostDash");
  setText("hostRole", localize(host.role) || t("serviceRole"));
  setText("hostEyebrow", eyebrow || "HostDash");
  setText("mainTitle", localize(host.heading) || t("services"));
  // The default sub-line repeated the eyebrow (role · fqdn · ip · os) word for word.
  // Identity now lives in the eyebrow and the brand; the hero's second line is the
  // board summary. An explicit `host.subtitle` is still shown.
  setText("hostSubtitle", localize(host.subtitle));

  const meta = document.getElementById("meta");
  meta.replaceChildren();
  (CONFIG.meta || []).forEach(item => {
    const span = el("span");
    const text = localize(isObject(item) && "text" in item ? item.text : item);
    if (typeof item === "object" && item.code) {
      const code = el("code");
      code.textContent = text;
      span.appendChild(code);
    } else {
      span.textContent = text;
    }
    meta.appendChild(span);
  });
}

const wingsEl = document.getElementById("wings");
const sideChips = document.getElementById("sideChips");
const empty = document.getElementById("empty");
let filter = localStorage.getItem(wingKey) || "all";
const cardIndex = [];
const cardServices = new Map();
const statusLabels = new WeakMap();

// ── EVIDENCE OR SILENCE (HOSTD-81) ──────────────────────────────────────────
//
// A pill is a claim. The board makes one only when something actually answered: a
// fresh status-artifact entry for the container or unit, a host-side HTTP result, a
// service's own telemetry, or a browser probe that settled. Everything else — still
// checking, no artifact, a stale artifact, a passive card the artifact does not
// mention — renders NO pill.
//
// Why nothing rather than a calm word: hsb9 is read by family, not operators. Every
// word on a card is a question to them, and "Unknown" on four of six cards read as
// four broken things. The absence of a pill says the true thing — nothing to report —
// without inviting a phone call. The operator loses nothing: these cards stay out of
// the online count, the reason is in the card's tooltip, and the sidebar says where
// the states come from. Real failures (down, stopped, fault) are never silent.
const NEUTRAL = new Set(["checking", "unknown", "passive"]);
const TONE = {
  up: "ok", running: "ok", external: "ok", protected: "ok", muted: "quiet",
  unreachable: "warn", cert: "warn",
  down: "bad", stopped: "bad", fault: "bad",
};
const FAILED = new Set(["down", "stopped", "fault"]);
// Re-check bookkeeping: the token of the newest probe per card. A probe whose token is
// no longer current lost a race to a newer sweep and must not overwrite its answer.
const probeTokens = new WeakMap();
let cardOrder = 0;
// A handful of services is a board people read; dozens is one an operator scans.
document.documentElement.dataset.density = SVC.length <= 8 ? "comfortable" : "compact";

function makeChip(id, label, color) {
  const button = el("button", "chip");
  button.type = "button";
  button.dataset.wing = id;
  button.style.setProperty("--c", color || "var(--ink)");
  button.setAttribute("aria-pressed", id === filter);
  button.innerHTML = `<span class="swatch"></span><span class="label"></span><span class="n" data-n="${id}">0</span>`;
  button.querySelector(".label").textContent = label;
  button.addEventListener("click", () => {
    filter = id;
    localStorage.setItem(wingKey, id);
    applyFilter();
  });
  return button;
}

function renderChips(target) {
  target.appendChild(makeChip("all", t("allServices"), "var(--ink)"));
  WINGS.forEach(wing => target.appendChild(makeChip(wing.id, localize(wing.name), wing.color)));
}
renderHostInfo();
renderChips(sideChips);

WINGS.forEach(wing => {
  const services = SVC.filter(service => service.wing === wing.id);
  const section = el("section", "wing");
  section.dataset.wing = wing.id;
  section.style.setProperty("--c", wing.color);

  const heading = el("div", "heading");
  heading.innerHTML = `
    <div class="heading-left">
      <svg><use href="#i-${wing.icon}"></use></svg>
      <h2></h2>
      <span class="n">${services.length}</span>
    </div>
    <div class="rule"></div>`;
  section.appendChild(heading);
  heading.querySelector("h2").textContent = localize(wing.name);

  const deck = el("div", "deck");
  services.forEach(service => {
    const active = !service.passive;
    // A service the HOST can vouch for is trackable even with no URL to click.
    // This is what finally lights up the passive half of the board — Mosquitto,
    // restic, Watchtower, pharos-beacon and friends, which have no HTTP endpoint
    // and so were never checked at all, merely drawn.
    const extraKey = stringOr(service.extra);
    const tracked = !!(service.container || service.unit || extraKey);
    const card = active ? el("a", "svc") : el("div", "svc passive");
    card.style.setProperty("--c", wing.color);
    card.style.setProperty("--i", String(cardOrder++));
    cardServices.set(card, service);

    if (service.container) card.dataset.container = service.container;
    if (service.unit) card.dataset.unit = service.unit;
    if (extraKey) card.dataset.extra = extraKey;

    if (active) {
      const targetUrl = serviceTargetUrl(service);
      card.href = targetUrl;
      card.target = "_blank";
      card.rel = "noopener";
      if (service.status) card.dataset.staticState = service.status;
      else if (service.probe === false) card.dataset.staticState = "external";
      else card.dataset.probe = targetUrl;
      // NOTE: `certIssue` is deliberately NOT a static state any more. It existed
      // only to stop a self-signed cert being reported as "Down" — a workaround for
      // the probe's blindness. With host truth we can say the true thing instead:
      // running, but the browser cannot reach it. The flag survives as a hint below.
      if (service.certIssue) card.dataset.certIssue = "1";
    }
    if (service.note) {
      card.title = localize(service.note);
      card.dataset.note = localize(service.note); // kept so HOSTD-12 can compose, not clobber
    }

    const status = service.status || (active || tracked ? "checking" : "passive");
    const foot = active
      ? `<span class="port"></span><span class="action"><span class="action-label" data-i18n="open">${t("open")}</span><svg aria-hidden="true"><use href="#i-arrow"></use></svg></span>`
      : `<span class="port"></span>`;

    card.innerHTML = `
      <div class="svc-top">
        <span class="icon" aria-hidden="true"><svg><use href="#i-${service.icon}"></use></svg></span>
        <span class="state" data-s="${status}" hidden><span class="dot"></span><span class="state-label"></span></span>
      </div>
      <div>
        <h3></h3>
        <p class="purpose"></p>
      </div>
      <div class="svc-foot">${foot}</div>`;
    renderService(card, service);
    renderStatus(card, status);
    deck.appendChild(card);
    if (active || tracked) cardIndex.push(card);
  });
  section.appendChild(deck);
  wingsEl.appendChild(section);
});

function serviceTargetUrl(service) {
  if (!service.sameHost || !/^https?:$/.test(window.location.protocol) || !window.location.hostname) {
    return service.url;
  }

  const target = new URL(window.location.href);
  target.protocol = service.scheme || target.protocol;
  // A path-only service (no port) lives on this dashboard's own server: keep its port.
  const port = String(service.hostPort || service.port || "").replace(/^:/, "").split(/\s+/)[0];
  if (/^\d+$/.test(port)) target.port = port;
  target.pathname = service.path || "/";
  target.search = service.search || "";
  target.hash = "";
  return target.href;
}

function statusText(state) {
  const key = `status_${state}`;
  return key in STRINGS.en ? t(key) : "";
}

// Paint the pill for the card's current state (see EVIDENCE OR SILENCE above). Also
// the language-switch path, so a hidden pill never regains a label behind our back.
function renderStatus(card, state = card.querySelector(".state").dataset.s) {
  const badge = card.querySelector(".state");
  const label = statusLabels.get(card);
  const text = label ? t(label.key, label.vars) : statusText(state);
  const silent = NEUTRAL.has(state) || !text;
  badge.dataset.s = state;
  badge.hidden = silent;
  badge.querySelector(".state-label").textContent = silent ? "" : text;
  card.dataset.tone = silent ? "none" : TONE[state] || "none";
  renderCardTitle(card);
}

function renderService(card, service) {
  const name = localize(service.name);
  const purpose = localize(service.purpose);
  const foot = localize(service.passive ? service.foot : service.port || service.path);
  card.querySelector("h3").textContent = name;
  card.querySelector(".purpose").textContent = purpose;
  card.querySelector(".svc-foot .port").textContent = foot;
  card.dataset.name = `${name} ${purpose} ${foot}`.toLowerCase();
  card.dataset.note = localize(service.note);
  renderCardTitle(card);
}

function renderCardTitle(card) {
  const note = card.dataset.note || "";
  const state = card.querySelector(".state")?.dataset.s;
  let lead = "";
  if (card.dataset.hostOk) {
    lead = t("hostOkExplanation", { code: card.dataset.hostOk });
  } else if (state === "unknown" || state === "passive") {
    // No pill, so the operator's reason lives here ("No telemetry", or plainly none).
    const label = statusLabels.get(card);
    lead = label ? t(label.key, label.vars) : t("noEvidence");
  }
  card.title = lead ? lead + (note ? ` (${note})` : "") : note;
}

function renderLanguage() {
  document.documentElement.lang = language;
  renderChrome();
  renderHostInfo();
  document.querySelectorAll(".chip").forEach(chip => {
    const wing = WINGS.find(item => item.id === chip.dataset.wing);
    chip.querySelector(".label").textContent = wing ? localize(wing.name) : t("allServices");
  });
  document.querySelectorAll(".wing").forEach(section => {
    const wing = WINGS.find(item => item.id === section.dataset.wing);
    section.querySelector(".heading h2").textContent = localize(wing.name);
  });
  cardServices.forEach((service, card) => {
    renderService(card, service);
    renderStatus(card);
  });
  renderTruth();
  tick();
  counts();
  applyFilter();
}

function switchLanguage(next, persist = false) {
  if (!validLanguage(next)) return;
  if (persist) {
    try { localStorage.setItem(LANGUAGE_KEY, next); } catch { /* Still switch this tab. */ }
  }
  language = next;
  renderLanguage();
}

function counts() {
  const per = {};
  WINGS.forEach(wing => { per[wing.id] = 0; });
  let online = 0;
  // What counts as "online" is a claim, so only count what was actually established.
  //
  // `unreachable` COUNTS: the host confirmed the service is running. Your browser just
  // cannot get to it, which is a fact about the network, not about the service.
  //
  // `unknown` does NOT count, and neither does `stopped` or `down`. Previously `cert`
  // and `external` were counted as online without anything ever being verified — a
  // number inflated by services nobody had checked. They still count (a cert error and
  // an external link both imply something is answering), but nothing UNMEASURED does.
  // `muted` COUNTS as online: the babycam is healthy and deliberately silent. If a
  // chosen state dented the tally every night, the number would be meaningless and the
  // dashboard would be teaching you to disregard it. `fault` does not count — that one
  // is the service itself saying it is broken.
  const ONLINE = new Set(["up", "running", "unreachable", "muted", "cert", "external", "protected"]);
  let warn = 0;
  let failed = 0;
  let pending = 0;
  cardIndex.forEach(card => {
    const state = card.querySelector(".state").dataset.s;
    if (ONLINE.has(state)) {
      online += 1;
      per[card.closest(".wing").dataset.wing] += 1;
    }
    if (TONE[state] === "warn") warn += 1;
    if (FAILED.has(state)) failed += 1;
    if (state === "checking") pending += 1;
  });
  const total = cardIndex.length;
  document.getElementById("onCount").textContent = online;
  document.getElementById("totCount").textContent = total;
  document.querySelectorAll(".chip .n").forEach(node => {
    const id = node.dataset.n;
    node.textContent = id === "all" ? `${online}/${total}` : (per[id] || 0);
  });
  // Meter: established (green), reachable-only-from-the-host (amber), failed (red).
  // Cards without evidence are the bare track — they claim nothing either way.
  const share = n => `${total ? (n / total) * 100 : 0}%`;
  document.querySelector(".meter-ok").style.width = share(online - warn);
  document.querySelector(".meter-warn").style.width = share(warn);
  document.querySelector(".meter-bad").style.width = share(failed);
  renderSummary({ warn, failed, pending });
}

// The hero's one-line answer to "is anything wrong?". Only real failures make it red;
// a missing artifact or a passive card with no evidence never does.
function renderSummary({ warn, failed, pending }) {
  const [tone, key, n] = failed ? ["bad", failed === 1 ? "summaryBadOne" : "summaryBadMany", failed]
    : warn ? ["warn", warn === 1 ? "summaryWarnOne" : "summaryWarnMany", warn]
      : pending ? ["pending", "summaryChecking", 0]
        : ["ok", "summaryOk", 0];
  const summary = document.getElementById("boardSummary");
  summary.dataset.tone = tone;
  setText("summaryText", t(key, { n }));
  renderFavicon(tone === "bad" ? "#ba372d" : tone === "warn" ? "#d49324" : "");
}

// Tab icon: the sidebar mark in ink, with a status dot only when something is wrong,
// so a pinned tab tells an operator to look without anyone opening it.
let faviconKey = null;
function renderFavicon(dot) {
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--home").trim() || "#d45c3f";
  const key = `${accent}|${dot}`;
  if (key === faviconKey) return;
  faviconKey = key;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#172016"/>` +
    `<g fill="none" stroke="${accent}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">` +
    `<rect x="13" y="13" width="38" height="15" rx="4"/><rect x="13" y="36" width="38" height="15" rx="4"/>` +
    `<path d="M21 20.5h.01M21 43.5h.01"/></g>` +
    (dot ? `<circle cx="50" cy="50" r="12" fill="${dot}" stroke="#ffffff" stroke-width="4"/>` : "") + `</svg>`;
  const link = document.getElementById("favicon");
  if (link) link.href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
}

function syncPressed() {
  document.querySelectorAll(".chip").forEach(chip => {
    chip.setAttribute("aria-pressed", chip.dataset.wing === filter);
  });
}

function applyFilter() {
  syncPressed();
  runSearch();
}

const search = document.getElementById("q");
const workspace = document.getElementById("workspace");
const zoomRange = document.getElementById("zoomRange");
const zoomValue = document.getElementById("zoomValue");
const zoomFit = document.getElementById("zoomFit");
const zoomReset = document.getElementById("zoomReset");
const zoomOut = document.getElementById("zoomOut");
const zoomIn = document.getElementById("zoomIn");
const zoomKey = `${storagePrefix}.zoom`;
const zoomModeKey = `${storagePrefix}.zoomMode`;

function clampZoom(value) {
  return Math.max(50, Math.min(200, Math.round(Number(value) / 5) * 5));
}

function setZoom(value, mode = "manual") {
  const next = clampZoom(value);
  document.documentElement.style.setProperty("--zoom", String(next / 100));
  zoomRange.value = String(next);
  zoomRange.style.setProperty("--pct", `${((next - 50) / 150) * 100}%`);
  zoomValue.value = `${next}%`;
  zoomValue.textContent = `${next}%`;
  zoomOut.disabled = next <= 50;
  zoomIn.disabled = next >= 200;
  localStorage.setItem(zoomKey, String(next));
  localStorage.setItem(zoomModeKey, mode);
}

function fitAll() {
  filter = "all";
  localStorage.setItem(wingKey, filter);
  search.value = "";
  applyFilter();
  setZoom(100, "fit");
  requestAnimationFrame(() => {
    const box = workspace.getBoundingClientRect();
    const availableWidth = Math.max(320, document.documentElement.clientWidth - box.left - 18);
    const availableHeight = Math.max(360, window.innerHeight - box.top - 18);
    const scale = Math.min(1, availableWidth / workspace.scrollWidth, availableHeight / workspace.scrollHeight);
    setZoom(Math.max(50, Math.floor(scale * 100 / 5) * 5), "fit");
  });
}

zoomRange.addEventListener("input", () => setZoom(zoomRange.value));
zoomOut.addEventListener("click", () => setZoom(Number(zoomRange.value) - 5));
zoomIn.addEventListener("click", () => setZoom(Number(zoomRange.value) + 5));
zoomReset.addEventListener("click", () => setZoom(100));
zoomFit.addEventListener("click", fitAll);
window.addEventListener("resize", () => {
  if (localStorage.getItem(zoomModeKey) === "fit") fitAll();
});

setZoom(localStorage.getItem(zoomKey) || 100, localStorage.getItem(zoomModeKey) || "manual");

function runSearch() {
  const term = search.value.trim().toLowerCase();
  let visibleSections = 0;
  document.querySelectorAll(".wing").forEach(section => {
    if (filter !== "all" && section.dataset.wing !== filter) {
      section.classList.add("hidden");
      return;
    }

    let shown = 0;
    section.querySelectorAll(".svc").forEach(card => {
      const hit = !term || card.dataset.name.includes(term);
      card.classList.toggle("hidden", !hit);
      if (hit) shown += 1;
    });

    section.classList.toggle("hidden", shown === 0);
    if (shown > 0) visibleSections += 1;
  });
  empty.style.display = visibleSections === 0 ? "block" : "none";
}

search.addEventListener("input", runSearch);
document.addEventListener("keydown", event => {
  if (event.key === "/" && document.activeElement !== search) {
    event.preventDefault();
    search.focus();
  }
  if (event.key === "Escape") {
    search.value = "";
    search.blur();
    runSearch();
  }
});

function setStatus(card, state, labelKey, vars = {}) {
  // `labelKey` lets a service that publishes real telemetry name its own condition —
  // "audio dead" is a diagnosis; "Down" is a shrug.
  if (labelKey) statusLabels.set(card, { key: labelKey, vars });
  else statusLabels.delete(card);
  if (state !== "unreachable") delete card.dataset.hostOk;
  renderStatus(card, state);
}

// What the host says about this card: "running" | "stopped" | null.
function cardHostState(card) {
  if (!HOST_STATUS) return null;
  const { container, unit } = card.dataset;
  const entry = container
    ? HOST_STATUS.containers?.[container]
    : unit
      ? HOST_STATUS.units?.[unit]
      : null;
  if (!entry) return null;
  return entry.running ? "running" : "stopped";
}

// ── EXTRAS: services that publish real health, not just a liveness bit (HOSTD-10) ──
//
// Some services know far more about themselves than "the process exists". The babycam
// (NIX-151) publishes decoder counters proving frames and audio are genuinely MOVING,
// plus the user's intended volume versus VLC's actual one. That is a better signal
// than anything a socket poke could produce, and it should not be flattened into up/down.
//
// THE ONE RULE THAT MATTERS HERE: `desired_volume: 0` IS NOT A FAULT.
//
// The babycam is deliberately muted most nights — with the bedroom door open the boy is
// audible directly, so the kiosk gets silenced from a button. Painting that red would
// make the dashboard cry wolf every single night, and an alarm you learn to ignore is
// not an alarm. It is reported as MUTED — a healthy, chosen state — and still counts as
// online, because it is.
//
// The real fault is the opposite and far quieter: desired > 0 while actual is 0, i.e.
// the parents believe the monitor is on and it is silent. That reads as a fault, loudly.
function extraState(card) {
  if (!HOST_STATUS) return null;
  const key = card.dataset.extra;
  if (!key) return null;
  const x = HOST_STATUS.extras?.[key];
  if (!x || typeof x !== "object") return { state: "unknown", key: "noTelemetry" };

  if (x.health && x.health !== "OK") {
    // Show the actual failure mode (AUDIO_DEAD, VIDEO_STALE, VOLUME_DRIFT …) rather
    // than a generic "Down". Naming the fault is most of the diagnosis.
    const key = `health_${x.health}`;
    return { state: "fault", key: key in STRINGS.en ? key : "healthFault", vars: {
      health: String(x.health).replace(/_/g, " ").toLowerCase(), healthCode: String(x.health),
    } };
  }
  if (typeof x.desired_volume === "number" && x.desired_volume === 0) {
    return { state: "muted", key: "mutedOnPurpose" };
  }
  return { state: "up", key: "listening" };
}

// ── HOST-SIDE HTTP TRUTH (HOSTD-12) ─────────────────────────────────────────
//
// HOSTD-7 fixed "is it running?". It did NOT fix "is it WORKING?", though the header
// comment above has claimed that scalp since day one: a service returning HTTP 500 has
// a running container and a browser fetch that RESOLVES — `no-cors` rejects only on a
// network error, never on a status code — so it still reads "Online". The one failure
// the original ticket named first is the one that survived it.
//
// A status code cannot be read client-side. Ever. Same reason as `running`. So the host
// curls each service over loopback and writes the code into status.json, where it is
// same-origin and therefore legible. `-k` on loopback also makes the self-signed
// certificate a non-issue, which is what finally lets the board separate the two things
// that look identical from a browser:
//
//   the service is broken            -> HTTP 500 from the host        -> Fault
//   the service is fine, YOUR path isn't -> HTTP 200 from the host    -> "OK on host"
//
// That second line is the Scrypted card, and it is the whole reason this exists: a
// camera hub visibly serving video while the board called it unreachable.
//
// Shape: http: { "<key>": { code: <int>, ms: <int> } }, keyed by container/unit name.
// Absent key, absent section, or an old generator that writes neither -> null, and every
// path below falls back to exactly the pre-HOSTD-12 behaviour. Nothing here is required.
function hostHttpFor(card) {
  if (!HOST_STATUS) return null;
  const key = card.dataset.httpKey || card.dataset.container || card.dataset.unit;
  if (!key) return null;
  const entry = HOST_STATUS.http?.[key];
  if (!entry || typeof entry !== "object") return null;

  const code = Number(entry.code);
  if (!Number.isFinite(code)) return null;
  // curl writes 000 when it never got an HTTP response at all. The container is up and
  // the host still got nothing back from it — that is the service failing, not the
  // network, and it is invisible to every other signal on this board.
  if (code === 0) return { kind: "silent", code };
  if (code >= 500) return { kind: "fault", code };
  return { kind: "ok", code };
}

// The probe measures ONE thing: can THIS BROWSER reach it. It is no longer allowed
// to pronounce on whether the service is running — it never could, it just did.
//
// `hostState` is the host's verdict, and it wins on the question of running/stopped.
// The probe only refines it with client reachability:
//
//   host running + probe ok   -> "up"          — running, and you can open it
//   host running + probe fail -> "unreachable"  — running; YOUR path to it is broken
//                                (self-signed cert, wrong network, Tailscale, CORP).
//                                Emphatically NOT "Down". The service is fine.
//   no host truth + probe ok   -> "up"          — legacy behaviour, all we can say
//   no host truth + probe fail -> "down"        — legacy behaviour, honestly ambiguous
//
// HOSTD-12 sharpens only the middle case. When the host's own HTTP check got a real
// answer, "Unreachable" is an understatement bordering on a lie — the service is proven
// healthy and the fault is entirely in this browser's path to it. Say that instead.
function probe(card, hostState, hostHttp, token) {
  // A newer sweep (or a host-truth verdict) has taken this card over since we started;
  // our answer is older than what is on screen and must not overwrite it.
  const current = () => probeTokens.get(card) === token;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 4000);
  fetch(card.dataset.probe, { mode: "no-cors", signal: controller.signal })
    .then(response => {
      // Same-origin (a path on this dashboard's own nginx) is readable. Its 403 or 502
      // is that nginx refusing or missing the upstream, not the service being reachable.
      if (response.type === "basic" && !response.ok) throw new Error(`HTTP ${response.status}`);
      if (current()) setStatus(card, "up");
    })
    .catch(() => {
      if (!current()) return;
      if (hostState !== "running") return setStatus(card, "down");
      if (hostHttp?.kind === "ok") {
        card.dataset.hostOk = String(hostHttp.code);
        return setStatus(card, "unreachable", "hostOk");
      }
      setStatus(card, "unreachable");
    })
    .finally(() => {
      clearTimeout(timeout);
      if (current()) {
        probeTokens.delete(card);
        card.removeAttribute("aria-busy");
      }
      counts();
    });
}

async function sweep() {
  // Host truth first, every time. The probes below are refinements of it, so reading a
  // snapshot from whenever the tab was opened would make each sweep re-decorate a fact
  // that expired days ago.
  await refreshHostStatus();

  let index = 0;
  const queue = [...cardIndex];
  (function next() {
    if (index >= queue.length) return;
    const batch = queue.slice(index, index + 5);
    index += 5;
    batch.forEach(card => {
      // Every sweep takes the card over: any probe still in flight from an earlier
      // sweep is now stale and will be ignored when it lands.
      const token = {};
      probeTokens.set(card, token);
      card.removeAttribute("aria-busy");

      if (card.dataset.staticState) {
        setStatus(card, card.dataset.staticState);
        counts();
        return;
      }

      // A service that publishes its own health outranks everything else: it is the
      // only signal here that reflects what the service is actually DOING, rather than
      // merely that it exists.
      const extra = extraState(card);
      if (extra) {
        setStatus(card, extra.state, extra.key, extra.vars);
        counts();
        return;
      }

      const host = cardHostState(card);

      // The host says it is NOT running. That is authoritative and needs no probe —
      // and it is the one thing the old dashboard could never tell you, because an
      // unreachable socket and a stopped service looked identical.
      if (host === "stopped") {
        setStatus(card, "stopped");
        counts();
        return;
      }

      // The host asked the service directly and it answered badly. That outranks the
      // browser probe entirely: a 500 is the service telling you it is broken, and no
      // amount of client-side reachability changes that. This is the case the original
      // host-truth ticket named first and never actually caught — a fetch resolves on a
      // 500 exactly as it does on a 200, so the board called it "Online".
      const hostHttp = hostHttpFor(card);
      if (host === "running" && hostHttp?.kind === "fault") {
        setStatus(card, "fault", "httpStatus", { code: hostHttp.code });
        counts();
        return;
      }
      // Running, and the host got nothing back at all. Not a routing problem — there is
      // simply nothing answering behind a container that claims to be up.
      if (host === "running" && hostHttp?.kind === "silent") {
        setStatus(card, "fault", "noAnswer");
        counts();
        return;
      }

      // Nothing to probe (no HTTP endpoint). Previously these were drawn as inert
      // "Passive" chips and excluded from the counts entirely. Now the host can
      // actually answer for them.
      if (!card.dataset.probe) {
        setStatus(card, host === "running" ? "running" : "unknown");
        counts();
        return;
      }

      // First look: "checking" (no pill). A re-check keeps the last answer on screen
      // and marks the card busy instead, so a healthy board does not blink to
      // "checking" every sweep. The answer is at most one probe timeout old.
      if (NEUTRAL.has(card.querySelector(".state").dataset.s)) setStatus(card, "checking");
      else card.setAttribute("aria-busy", "true");
      probe(card, host, hostHttp, token);
    });
    setTimeout(next, 300);
  })();
}

function tick() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleDateString(language === "de" ? "de-AT" : "en-GB", { weekday: "short", day: "2-digit", month: "2-digit" }) +
    " · " +
    now.toLocaleTimeString(language === "de" ? "de-AT" : "en-GB", { hour: "2-digit", minute: "2-digit" });
}

document.querySelectorAll("[data-language]").forEach(button => {
  button.addEventListener("click", () => switchLanguage(button.dataset.language, true));
});
window.addEventListener("storage", event => {
  if ((event.key === LANGUAGE_KEY || event.key === null) &&
      (!event.storageArea || event.storageArea === localStorage)) {
    switchLanguage(validLanguage(event.newValue) ? event.newValue : browserLanguage());
  }
});
// A same-origin tab may have changed the preference while the manifest was loading.
language = preferredLanguage();

renderLanguage();
counts();
sweep();
setInterval(tick, 60000);
setInterval(sweep, SWEEP_MS);
// The entrance plays once; filtering and searching afterwards stay instant.
setTimeout(() => document.documentElement.classList.remove("intro"), 1400);
</script>
</body>
</html>
