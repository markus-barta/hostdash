<!doctype html>
<html lang="en" class="intro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f6f4">
<title>HostDash</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23172016'/%3E%3Cg fill='none' stroke='%23d45c3f' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='13' y='13' width='38' height='15' rx='4'/%3E%3Crect x='13' y='36' width='38' height='15' rx='4'/%3E%3Cpath d='M21 20.5h.01M21 43.5h.01'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6f4;
    --surface: #ffffff;
    --surface-2: #f9faf8;
    --surface-3: #eef2ec;
    --side-bg: #f8f9f7;
    --line: #dce3da;
    --line-strong: #c6d1c3;
    --ink: #172016;
    --muted: #5b6958;
    --soft: #84907f;
    --shadow-rest: 0 1px 2px rgba(23, 32, 22, 0.05), 0 1px 1px rgba(23, 32, 22, 0.02);
    --shadow: 0 16px 32px -14px rgba(32, 45, 31, 0.22), 0 4px 10px -4px rgba(32, 45, 31, 0.08);
    --home: #d45c3f;
    --media: #b55787;
    --signals: #c98625;
    --safety: #668d55;
    --infra: #777465;
    --up: #267a53;
    --up-ink: #1f6a47;
    --checking: #d49324;
    --warn-ink: #85560f;
    --down: #ba372d;
    --down-ink: #a5302a;
    --passive: #9ca79a;
    --sans: Inter, "Avenir Next", Avenir, "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, "Cascadia Code", monospace;
    --zoom: 1;
    --side-w: 292px;
    --radius: 10px;
    --radius-sm: 8px;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--bg); }
  body {
    min-height: 100vh;
    margin: 0;
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background:
      linear-gradient(180deg, rgba(238, 242, 236, 0.86), rgba(244, 246, 244, 0) 320px),
      var(--bg);
    overflow-x: hidden;
  }
  ::selection { background: color-mix(in srgb, var(--home) 22%, transparent); }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  svg {
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* One focus ring for every control (HOSTD-81): 2px, solid, and dark enough to clear
     3:1 against both the page and a card. The old rings were 16 % tints that vanished
     on white. Mostly ink with a trace of the wing colour: a coral ring around a card
     would read as the red of a failure. */
  :where(a, button, input, [tabindex]):focus-visible {
    outline: 2px solid color-mix(in srgb, var(--c, var(--home)) 30%, var(--ink));
    outline-offset: 2px;
  }

  /* Section labels in the sidebar share one voice. */
  .status-row > span,
  .language > span,
  .zoom-title {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .app {
    display: grid;
    grid-template-columns: var(--side-w) minmax(0, 1fr);
    min-height: 100vh;
    /* The sidebar column keeps its tint and hairline all the way down, even past the
       sticky panel on long boards. */
    background: linear-gradient(90deg,
      var(--side-bg) 0 calc(var(--side-w) - 1px),
      var(--line) calc(var(--side-w) - 1px) var(--side-w),
      transparent var(--side-w));
  }

  .side {
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 24px 20px 28px;
    border-right: 1px solid var(--line);
    background: rgba(249, 250, 248, 0.9);
    backdrop-filter: blur(14px);
    overflow-y: auto;
    scrollbar-gutter: stable;
    scrollbar-width: thin;
  }

  .brand {
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 12px;
    align-items: center;
    padding: 2px 4px 20px;
  }
  .mark {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    color: var(--home);
    box-shadow: var(--shadow-rest), inset 0 -1px 0 rgba(23, 32, 22, 0.03);
  }
  .mark svg { width: 20px; height: 20px; }
  .brand h1 {
    margin: 0;
    font-size: 26px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    font-weight: 780;
  }
  .brand p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .status-panel {
    display: grid;
    gap: 10px;
    margin: 0 0 18px;
    padding: 14px 14px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-rest);
  }
  .status-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .status-row strong {
    color: var(--ink);
    font-size: 26px;
    font-weight: 760;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .status-row strong b { color: var(--up-ink); font-weight: inherit; }
  .status-row .of {
    margin-left: 2px;
    color: var(--muted);
    font-size: 17px;
    font-weight: 650;
    letter-spacing: 0;
  }

  /* Share of tracked services the board can vouch for, and of real failures. Neutral
     (no evidence) is simply the empty track: nothing is painted for what nobody measured. */
  .meter {
    display: flex;
    height: 6px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--surface-3);
  }
  .meter i {
    display: block;
    width: 0;
    height: 100%;
    transition: width 0.5s var(--ease);
  }
  .meter .meter-ok { background: var(--up); }
  .meter .meter-warn { background: var(--checking); }
  .meter .meter-bad { background: var(--down); }

  /* HOSTD-8 — provenance of the numbers above.

     "host truth" means the host itself vouched for what is running (docker ps /
     systemctl), which no browser can determine. Without it, every state on the board
     is inferred from an OPAQUE fetch that cannot even read a status code — and the
     board must SAY so, because a dashboard silently degraded to guessing looks exactly
     like one that knows. That indistinguishability is the bug.

     HOSTD-81: it says so calmly. A missing or stale artifact is an operator concern,
     not an alarm for whoever is reading the board, so the line reads neutral grey
     ("checked in this browser"); the precise reason stays in its tooltip. */
  .truth {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; letter-spacing: 0.01em;
    color: var(--muted);
  }
  .truth-dot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: transparent; box-shadow: inset 0 0 0 1.5px var(--soft);
  }
  .truth[data-t="live"] { color: var(--up-ink); }
  .truth[data-t="live"] .truth-dot { background: var(--up); box-shadow: 0 0 0 3px rgba(38, 122, 83, 0.14); }
  .truth[title] { cursor: help; }
  .clock {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .nav {
    display: grid;
    gap: 4px;
  }
  .chip {
    display: grid;
    grid-template-columns: 10px 1fr auto;
    gap: 10px;
    align-items: center;
    width: 100%;
    min-height: 44px;
    padding: 8px 10px 8px 12px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--ink);
    background: transparent;
    cursor: pointer;
    text-align: left;
    transition: background-color 0.16s var(--ease), border-color 0.16s var(--ease);
  }
  .chip:hover { background: var(--surface-3); }
  .chip:active { background: color-mix(in srgb, var(--c) 12%, var(--surface-3)); }
  .chip[aria-pressed="true"] {
    border-color: color-mix(in srgb, var(--c) 30%, var(--line));
    background: color-mix(in srgb, var(--c) 9%, var(--surface));
    box-shadow: var(--shadow-rest);
  }
  .chip .swatch {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--c, var(--ink));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--ink)) 15%, transparent);
  }
  .chip .label { font-size: 13.5px; font-weight: 650; }
  .chip .n {
    min-width: 26px;
    padding: 2px 7px;
    border-radius: 999px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .chip[aria-pressed="true"] .n { color: var(--ink); background: var(--surface); }

  .main {
    min-width: 0;
    max-width: 100vw;
    padding: 30px clamp(18px, 4vw, 48px) 56px;
  }
  .topbar {
    margin: 0 0 30px;
  }
  .title {
    min-width: 0;
  }
  /* Host identity. The dot used to be painted green unconditionally — a status claim
     nobody measured. It now follows host truth: green when the host vouches, quiet grey
     otherwise. */
  .eyebrow {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 0 0 10px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    overflow-wrap: anywhere;
  }
  .eyebrow::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--soft);
    box-shadow: 0 0 0 4px rgba(132, 144, 127, 0.16);
    transition: background-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
  }
  html[data-host-truth="live"] .eyebrow::before {
    background: var(--up);
    box-shadow: 0 0 0 4px rgba(38, 122, 83, 0.14);
  }
  .title h2 {
    margin: 0;
    max-width: 760px;
    font-size: 34px;
    line-height: 1.04;
    letter-spacing: -0.025em;
    font-weight: 780;
  }
  .title p {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 15px;
    overflow-wrap: anywhere;
  }
  .title p:empty { display: none; }

  /* The one sentence a family member needs: is anything wrong? Counts real failures
     only (down / stopped / fault), so it never cries wolf over missing evidence. */
  .summary {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    min-height: 34px;
    margin: 16px 0 0;
    padding: 6px 14px 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink);
    background: var(--surface);
    box-shadow: var(--shadow-rest);
    font-size: 14px;
    font-weight: 650;
    transition: background-color 0.3s var(--ease), border-color 0.3s var(--ease), color 0.3s var(--ease);
  }
  .summary-dot {
    width: 8px;
    height: 8px;
    flex: none;
    border-radius: 50%;
    background: transparent;
    box-shadow: inset 0 0 0 1.5px var(--soft);
  }
  .summary[data-tone="pending"] .summary-dot { animation: breathe 1.4s ease-in-out infinite; }
  .summary[data-tone="ok"] .summary-dot { background: var(--up); box-shadow: 0 0 0 4px rgba(38, 122, 83, 0.14); }
  .summary[data-tone="warn"] {
    color: var(--warn-ink);
    border-color: color-mix(in srgb, var(--checking) 40%, var(--line));
    background: color-mix(in srgb, var(--checking) 8%, var(--surface));
  }
  .summary[data-tone="warn"] .summary-dot { background: var(--checking); box-shadow: 0 0 0 4px rgba(212, 147, 36, 0.16); }
  .summary[data-tone="bad"] {
    color: var(--down-ink);
    border-color: color-mix(in srgb, var(--down) 36%, var(--line));
    background: color-mix(in srgb, var(--down) 7%, var(--surface));
  }
  .summary[data-tone="bad"] .summary-dot { background: var(--down); box-shadow: 0 0 0 4px rgba(186, 55, 45, 0.14); }

  .controls {
    display: grid;
    gap: 12px;
    min-width: 0;
    margin: 0 0 18px;
    padding: 0 0 18px;
    border-bottom: 1px solid var(--line);
  }
  .language {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .language-buttons {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface-3);
  }
  /* 44 x 48 hit area; the visible "key" is drawn inset so the control stays compact. */
  .language button {
    position: relative;
    isolation: isolate;
    min-width: 48px;
    min-height: 44px;
    padding: 0 12px;
    border: 0;
    border-radius: var(--radius-sm);
    color: var(--muted);
    background: transparent;
    font: 700 12.5px/1 var(--sans);
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: color 0.16s var(--ease);
  }
  .language button::before {
    content: "";
    position: absolute;
    inset: 5px;
    z-index: -1;
    border-radius: 6px;
    transition: background-color 0.16s var(--ease), box-shadow 0.16s var(--ease);
  }
  .language button:hover { color: var(--ink); }
  .language button:hover::before { background: rgba(255, 255, 255, 0.6); }
  .language button[aria-pressed="true"] { color: var(--ink); }
  .language button[aria-pressed="true"]::before {
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(23, 32, 22, 0.1), 0 0 0 1px var(--line);
  }

  .search {
    position: relative;
    min-width: 0;
  }
  .search input {
    width: 100%;
    min-width: 0;
    min-height: 46px;
    padding: 0 44px 0 40px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    outline: none;
    color: var(--ink);
    background: var(--surface);
    box-shadow: var(--shadow-rest);
    transition: border-color 0.16s var(--ease), box-shadow 0.16s var(--ease);
  }
  .search input::placeholder { color: var(--muted); opacity: 1; }
  .search input:hover { border-color: color-mix(in srgb, var(--home) 30%, var(--line-strong)); }
  .search input:focus {
    border-color: var(--home);
    box-shadow: 0 0 0 4px rgba(212, 92, 63, 0.14);
  }
  .search svg {
    position: absolute;
    left: 13px;
    top: 50%;
    width: 17px;
    height: 17px;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .kbd {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    min-width: 24px;
    padding: 2px 6px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 6px;
    color: var(--muted);
    background: var(--surface-2);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.2;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.16s var(--ease);
  }
  .search input:focus ~ .kbd,
  .search input:not(:placeholder-shown) ~ .kbd { opacity: 0; }

  .zoom {
    display: grid;
    gap: 8px;
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-rest);
  }
  .zoom-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .zoom-title {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .zoom-title svg {
    width: 16px;
    height: 16px;
    color: var(--soft);
  }
  .zoom output {
    display: block;
    min-width: 56px;
    padding: 4px 8px;
    border-radius: 6px;
    color: var(--ink);
    background: var(--surface-3);
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .zoom-row {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) 44px;
    gap: 8px;
    align-items: center;
  }
  .zoom-slider {
    position: relative;
    min-width: 0;
  }
  .zoom-bounds {
    position: absolute;
    left: 2px;
    right: 2px;
    bottom: -3px;
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    pointer-events: none;
  }
  .zoom button {
    display: grid;
    place-items: center;
    height: 44px;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--muted);
    background: var(--surface);
    cursor: pointer;
    box-shadow: var(--shadow-rest);
    transition: color 0.16s var(--ease), border-color 0.16s var(--ease), background-color 0.16s var(--ease);
  }
  .zoom button:hover {
    color: var(--ink);
    border-color: var(--line-strong);
    background: var(--surface-2);
  }
  .zoom button:active { background: var(--surface-3); box-shadow: none; }
  .zoom button:disabled {
    cursor: default;
    opacity: 0.42;
  }
  .zoom button svg {
    width: 16px;
    height: 16px;
  }
  /* The range keeps a 44px hit area; only the track is drawn thin. */
  .zoom input[type="range"] {
    --pct: 33.33%;
    display: block;
    width: 100%;
    height: 44px;
    min-width: 0;
    margin: 0;
    background: transparent;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .zoom input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--home) var(--pct), var(--line) var(--pct));
  }
  .zoom input[type="range"]::-webkit-slider-thumb {
    width: 18px;
    height: 18px;
    margin-top: -7px;
    border: 2px solid var(--home);
    border-radius: 50%;
    background: var(--surface);
    box-shadow: 0 1px 3px rgba(23, 32, 22, 0.22);
    -webkit-appearance: none;
    appearance: none;
    transition: transform 0.16s var(--ease);
  }
  .zoom input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.12); }
  .zoom input[type="range"]::-moz-range-track { height: 4px; border-radius: 999px; background: var(--line); }
  .zoom input[type="range"]::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--home); }
  .zoom input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: 2px solid var(--home);
    border-radius: 50%;
    background: var(--surface);
  }
  .zoom-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .zoom-actions button {
    grid-auto-flow: column;
    justify-content: center;
    gap: 7px;
    padding: 0 8px;
    color: var(--ink);
    font-size: 13px;
    font-weight: 650;
  }
  .zoom-actions button svg {
    width: 15px;
    height: 15px;
    color: var(--muted);
  }

  .workspace {
    zoom: var(--zoom);
    transform-origin: top left;
  }

  .wing {
    --c: var(--home);
    margin: 0 0 36px;
  }
  .heading {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 14px;
  }
  .heading-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .heading svg { width: 18px; height: 18px; color: var(--c); flex: none; }
  .heading h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 760;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }
  .heading .n {
    padding: 3px 7px;
    border-radius: 999px;
    color: var(--muted);
    background: var(--surface-3);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    line-height: 1.2;
  }
  .rule {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 40%, var(--line)), transparent 85%);
  }

  .deck {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    min-width: 0;
  }

  /* Cards. Clickable services are lifted white tiles with an "open" cue; passive ones
     sit flat on a quieter surface. The difference is elevation, not a dashed border. */
  .svc {
    position: relative;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 12px;
    min-height: 160px;
    min-width: 0;
    padding: 14px 16px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-rest);
    transition: transform 0.2s var(--ease), border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  a.svc { cursor: pointer; }
  a.svc:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--c) 45%, var(--line));
    box-shadow: var(--shadow);
  }
  a.svc:active {
    transform: translateY(0);
    box-shadow: var(--shadow-rest);
    transition-duration: 0.06s;
  }
  a.svc:focus-visible {
    outline-offset: 3px;
    border-color: color-mix(in srgb, var(--c) 45%, var(--line));
  }
  .svc.passive {
    background: var(--surface-2);
    border-color: color-mix(in srgb, var(--line) 85%, var(--surface-2));
    box-shadow: none;
  }
  /* A real failure marks the whole card, so it is found on a 47-card board too. */
  .svc[data-tone="bad"] {
    border-color: color-mix(in srgb, var(--down) 40%, var(--line));
  }
  .svc[data-tone="bad"]::before {
    content: "";
    position: absolute;
    left: -1px;
    top: 16px;
    bottom: 16px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--down);
  }
  .svc-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
    min-height: 40px;
  }
  .icon {
    display: grid;
    place-items: center;
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    color: var(--c);
    background: color-mix(in srgb, var(--c) 11%, var(--surface));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 14%, transparent);
  }
  .icon svg { width: 20px; height: 20px; }
  .svc.passive .icon {
    color: color-mix(in srgb, var(--c) 75%, var(--muted));
    background: var(--surface-3);
    box-shadow: none;
  }

  /* Status pills. Sentence case and a tinted fill read faster than tracked capitals,
     especially for older eyes; every text colour clears 4.5:1 on its own tint. */
  .state {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 26px;
    padding: 0 10px 0 9px;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--muted);
    background: var(--surface-3);
    font-size: 12px;
    font-weight: 650;
    line-height: 1;
    white-space: nowrap;
    flex-shrink: 0;
    animation: pill-in 0.28s var(--ease) both;
  }
  .state[hidden] { display: none; }
  .state-label { display: inline-block; }
  .state-label::first-letter { text-transform: uppercase; }
  .dot {
    width: 7px;
    height: 7px;
    flex: none;
    border-radius: 50%;
    background: var(--passive);
  }
  /* A re-check in flight keeps the last answer on screen (no flicker every sweep);
     the dot breathes so an operator can see it is being refreshed. */
  .svc[aria-busy="true"] .dot { animation: breathe 1.2s ease-in-out infinite; }

  .state[data-s="up"],
  .state[data-s="running"] {
    color: var(--up-ink);
    border-color: color-mix(in srgb, var(--up) 22%, transparent);
    background: color-mix(in srgb, var(--up) 9%, var(--surface));
  }
  .state[data-s="up"] .dot,
  .state[data-s="running"] .dot { background: var(--up); box-shadow: 0 0 0 3px rgba(38, 122, 83, 0.14); }
  .state[data-s="down"] {
    color: var(--down-ink);
    border-color: color-mix(in srgb, var(--down) 28%, transparent);
    background: color-mix(in srgb, var(--down) 8%, var(--surface));
  }
  .state[data-s="down"] .dot { background: var(--down); }
  .state[data-s="cert"] {
    color: var(--warn-ink);
    border-color: color-mix(in srgb, var(--checking) 34%, transparent);
    background: color-mix(in srgb, var(--checking) 10%, var(--surface));
  }
  .state[data-s="cert"] .dot { background: var(--checking); box-shadow: 0 0 0 3px rgba(212, 147, 36, 0.14); }
  .state[data-s="external"],
  .state[data-s="protected"] {
    color: var(--up-ink);
    border-color: color-mix(in srgb, var(--up) 24%, transparent);
    background: var(--surface);
  }
  .state[data-s="external"] .dot,
  .state[data-s="protected"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--up); }

  /* HOSTD-7 — states the dashboard could not previously express.

     "running": the HOST vouches for it (docker ps / systemctl). Solid green, because
     this is stronger evidence than any browser probe — it is not a guess at all.

     "unreachable": running, but THIS browser cannot reach it (self-signed cert, wrong
     network path, Tailscale, CORP). Amber, hollow: something is off, but it is about
     the route, not the service. Rendering this as red "Down" — as the old code did —
     sent you hunting a service that was never broken.

     "stopped": the host says it is NOT running. Solid red, and trustworthy, unlike a
     "Down" inferred from a failed socket.

     "unknown": no host truth and nothing probeable. HOSTD-7 drew it as a grey
     "Unknown" pill; HOSTD-81 draws nothing at all. Admitting ignorance is still the
     point — the board never paints a confident dot over a state nobody measured — but
     a word like "Unknown" on every passive card read as a fault to anyone who is not
     an operator. Silence is the honest rendering of no evidence. The reason stays in
     the card's tooltip, and the card stays out of the online count. */
  .state[data-s="unreachable"] {
    color: var(--warn-ink);
    border-color: color-mix(in srgb, var(--checking) 34%, transparent);
    background: color-mix(in srgb, var(--checking) 10%, var(--surface));
  }
  .state[data-s="unreachable"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--checking); }
  .state[data-s="stopped"] {
    color: var(--down-ink);
    border-color: color-mix(in srgb, var(--down) 28%, transparent);
    background: color-mix(in srgb, var(--down) 8%, var(--surface));
  }
  .state[data-s="stopped"] .dot { background: var(--down); }

  /* HOSTD-10 — states for services that report their own health.

     "muted": the babycam, deliberately silenced (bedroom door open, the boy audible
     directly — a nightly habit). This is HEALTHY and CHOSEN, so it is NOT red and NOT
     amber. Painting a deliberate choice as a problem is how a dashboard trains you to
     ignore it, and an alarm you learn to ignore is not an alarm. Muted, calm, hollow —
     visibly "off by intent", plainly not "broken".

     "fault": the service itself says it is broken. Solid red, and the card NAMES the
     failure ("audio dead", "video stale") instead of shrugging "Down". */
  .state[data-s="muted"] {
    color: var(--muted);
    border-color: var(--line);
    background: var(--surface-2);
  }
  .state[data-s="muted"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
  .state[data-s="fault"] {
    color: var(--down-ink);
    border-color: color-mix(in srgb, var(--down) 32%, transparent);
    background: color-mix(in srgb, var(--down) 9%, var(--surface));
  }
  .state[data-s="fault"] .dot { background: var(--down); box-shadow: 0 0 0 3px rgba(186, 55, 45, 0.14); }
  /* Host-confirmed unreachable (HOSTD-12): the service answered the HOST, so the hollow
     ring fills in. A plain "unreachable" means nothing was ever established; this one
     means the service is proven healthy and only your path to it is broken. */
  .svc[data-host-ok] .state[data-s="unreachable"] .dot { background: var(--checking); }

  .svc h3 {
    margin: 0;
    font-size: 17px;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -0.012em;
    overflow-wrap: anywhere;
  }
  .purpose {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.45;
  }
  .svc-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 22px;
    padding-top: 10px;
    border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    color: var(--muted);
  }
  .port {
    min-width: 0;
    overflow: hidden;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* The "open" cue: an arrow is always there on a clickable card; the word slides in
     on hover or keyboard focus (and stays visible on touch screens and small boards). */
  .action {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 700;
    transition: color 0.2s var(--ease);
  }
  .action-label {
    max-width: 0;
    overflow: hidden;
    opacity: 0;
    white-space: nowrap;
    transition: max-width 0.24s var(--ease), opacity 0.18s var(--ease);
  }
  .action svg {
    width: 15px;
    height: 15px;
    transition: transform 0.2s var(--ease);
  }
  /* The word is ink, never a wing colour: a coral "Open" next to a red "Down" reads as
     a second warning. The arrow carries the wing colour instead. */
  a.svc:hover .action,
  a.svc:focus-visible .action { color: var(--ink); }
  a.svc:hover .action svg,
  a.svc:focus-visible .action svg { color: color-mix(in srgb, var(--c) 72%, var(--ink)); }
  a.svc:hover .action-label,
  a.svc:focus-visible .action-label { max-width: 9em; opacity: 1; }
  a.svc:hover .action svg,
  a.svc:focus-visible .action svg { transform: translate(1px, -1px); }
  @media (hover: none) {
    .action { color: var(--ink); }
    .action svg { color: color-mix(in srgb, var(--c) 72%, var(--ink)); }
    .action-label { max-width: 9em; opacity: 1; }
  }

  .empty {
    display: none;
    padding: 32px 24px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 14px;
    text-align: center;
  }

  .hidden { display: none !important; }

  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 40px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
  }
  .meta span {
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--surface-3);
  }
  .meta code {
    font-family: var(--mono);
    font-size: 11.5px;
  }

  /* Comfortable density (HOSTD-81): a board with only a handful of services is read
     by people, not scanned by an operator — larger tiles, larger type, and the "open"
     word always visible. Dense boards keep the compact grid. */
  html[data-density="comfortable"] .title h2 { font-size: clamp(30px, 1.6vw + 18px, 40px); }
  html[data-density="comfortable"] .deck {
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  html[data-density="comfortable"] .svc {
    gap: 16px;
    min-height: 190px;
    padding: 20px 20px 16px;
  }
  html[data-density="comfortable"] .svc-foot { padding-top: 12px; }
  html[data-density="comfortable"] .icon { width: 48px; height: 48px; border-radius: 12px; }
  html[data-density="comfortable"] .icon svg { width: 24px; height: 24px; }
  html[data-density="comfortable"] .svc-top { min-height: 48px; }
  html[data-density="comfortable"] .svc h3 { font-size: 19px; }
  html[data-density="comfortable"] .purpose { margin-top: 6px; font-size: 14.5px; }
  html[data-density="comfortable"] .state { min-height: 28px; font-size: 13px; }
  html[data-density="comfortable"] .action { font-size: 13px; color: var(--ink); }
  html[data-density="comfortable"] .action svg { color: color-mix(in srgb, var(--c) 72%, var(--ink)); }
  html[data-density="comfortable"] .action-label { max-width: 9em; opacity: 1; }

  /* Entrance: one short staggered rise on first paint, then out of the way. */
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pill-in { from { opacity: 0; transform: scale(0.9); } }
  @keyframes breathe { 50% { opacity: 0.36; } }
  html.intro .topbar { animation: rise 0.42s var(--ease) backwards; }
  html.intro .side > * { animation: fade 0.5s var(--ease) backwards; }
  html.intro .heading { animation: fade 0.4s var(--ease) backwards; animation-delay: 60ms; }
  html.intro .svc {
    animation: rise 0.42s var(--ease) backwards;
    animation-delay: calc(min(var(--i, 0), 14) * 28ms + 80ms);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (max-width: 900px) {
    .app { display: block; background: none; }
    .side {
      position: relative;
      display: grid;
      grid-template-columns: minmax(170px, 1fr) minmax(240px, 1.35fr);
      gap: 14px 18px;
      height: auto;
      padding: 16px;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      background: var(--side-bg);
      overflow: visible;
    }
    .brand {
      align-self: center;
      padding: 0;
    }
    .status-panel {
      align-self: start;
      margin: 0;
    }
    .controls {
      grid-column: 2;
      grid-row: 1 / span 2;
      align-self: stretch;
      margin: 0;
      padding: 0 0 0 18px;
      border-bottom: 0;
      border-left: 1px solid var(--line);
      align-content: center;
    }
    .nav {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 4px 6px;
      margin: 0 -4px;
      scrollbar-width: none;
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
      mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav .chip {
      width: auto;
      min-width: max-content;
      grid-template-columns: 8px auto auto;
      padding: 8px 8px 8px 14px;
      border-color: var(--line);
      border-radius: 999px;
      background: var(--surface);
    }
    .nav .chip[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--c) 36%, var(--line));
      background: color-mix(in srgb, var(--c) 9%, var(--surface));
    }
    .nav .chip:last-child { margin-right: 24px; }
    .main { padding-top: 28px; }
    .topbar { margin-bottom: 24px; }
  }
  @media (max-width: 560px) {
    .main { padding: 24px 14px 40px; }
    .side {
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 14px 14px 10px;
    }
    .brand {
      grid-template-columns: 40px 1fr;
      gap: 10px;
    }
    .mark {
      width: 40px;
      height: 40px;
      border-radius: 11px;
    }
    .brand h1 { font-size: 23px; }
    .status-panel {
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px 12px;
      padding: 12px 14px;
    }
    .status-row, .meter { grid-column: 1 / -1; }
    .clock { text-align: right; }
    .controls {
      grid-column: 1;
      grid-row: auto;
      padding: 0 0 14px;
      border-left: 0;
      border-bottom: 1px solid var(--line);
    }
    .deck,
    html[data-density="comfortable"] .deck { grid-template-columns: 1fr; gap: 10px; }
    .svc,
    html[data-density="comfortable"] .svc { min-height: 0; padding: 16px 16px 14px; gap: 12px; }
    .title h2,
    html[data-density="comfortable"] .title h2 { font-size: 30px; }
    .wing { margin-bottom: 30px; }
    .heading { gap: 10px; }
    .meta { margin-top: 28px; }
  }
</style>

    noArtifact: "keine Statusdatei", unknownSchema: "unbekanntes Statusformat",

    browserChecks: "Im Browser geprüft",

    hostOkExplanation: "Der Dienst läuft, und das Gerät selbst erhält HTTP {code}. Nur dieser Browser kann ihn nicht erreichen — etwa wegen eines selbstsignierten Zertifikats, des falschen Netzwerks oder einer VPN-Verbindung.",

    noAnswer: "keine Antwort", hostOk: "Am Gerät erreichbar", httpStatus: "HTTP {code}",
    health_AUDIO_DEAD: "Ton ausgefallen", health_VIDEO_STALE: "Bild veraltet", health_VOLUME_DRIFT: "Lautstärke abweichend",
