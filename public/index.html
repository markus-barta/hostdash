<!doctype html>
<html lang="en" data-theme="light" data-audience="operator" data-density="list" data-v="checking" data-truth="checking">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HostDash</title>
<link rel="icon" id="favicon" href="data:,">
<script>
/* Appearance before first paint: a remembered choice, otherwise the system setting. */
(function () {
  var stored = null;
  try { stored = localStorage.getItem("hostdash.theme"); } catch (e) { /* blocked storage: follow the system */ }
  var dark = stored === "dark" || (stored !== "light" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
})();
</script>
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   HostDash · 2026 board (HOSTD-83, from the approved HOSTD-82 "Lichter" design)
   The evidence rule: light only where a source vouches for it.
   A status is a small glass LED. Lit green: the host reports it running.
   Green ring around dark glass: only this browser reached it. Green core in an
   amber ring: running, but this device cannot get through. Amber ring around dark
   glass: this browser cannot get through and the host says nothing. Lit red: a real
   reported failure. Dark glass: no evidence, so no claim.
   ───────────────────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --pad:clamp(1rem,2.4vw,2rem);
  --r-hero:1.75rem;--r-card:1.375rem;--r-mid:1rem;--r-ctl:.75rem;
  --zoom:1;
  /* board accent; the script replaces these from the config's palette */
  --accent:#0066CC;--accent-fill:#0066CC;--on-accent:#FFFFFF;
  --accent-tint:color-mix(in srgb,var(--accent) 13%,transparent);
  --accent-tint-2:color-mix(in srgb,var(--accent) 22%,transparent);
  --focus:color-mix(in srgb,var(--accent) 78%,transparent);
  font-size:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;
}
@media (min-width:1800px){html{font-size:106.25%}}
@media (min-width:2400px){html{font-size:118.75%}}

/* ── themes: neutral surfaces, one board accent ──────────────────────────── */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#F2F2F5;--surface:#FFFFFF;--surface-2:#F6F6F8;--surface-3:#ECECF0;
  --fill:rgba(116,116,128,.12);--fill-2:rgba(116,116,128,.07);--fill-3:rgba(116,116,128,.2);
  --sep:rgba(60,60,67,.13);--hair:rgba(0,0,0,.06);
  --text:#1D1D1F;--text-2:#56565D;--text-3:#6C6C73;
  --red:#C8170E;--amber:#8F5300;
  --tint-bad:#FFF3F2;--line-bad:rgba(200,23,14,.24);
  --tint-warn:#FFF7EA;--line-warn:rgba(143,83,0,.22);
  --sh-1:0 0 0 .5px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.04);
  --sh-2:0 0 0 .5px rgba(0,0,0,.06),0 2px 5px rgba(0,0,0,.05),0 12px 28px rgba(0,0,0,.09);
  --sh-3:0 0 0 .5px rgba(0,0,0,.04),0 2px 6px rgba(0,0,0,.04),0 18px 44px rgba(0,0,0,.07);
  --hi:inset 0 .5px 0 rgba(255,255,255,.9);
  --glass-1:#E2E2E8;--glass-2:#B3B3BC;--glass-rim:rgba(0,0,0,.2);
  --g1:#A6F3BA;--g2:#34C759;--g3:#1B9142;--glow-g:rgba(52,199,89,.55);
  --r1:#FFB3AB;--r2:#FF3B30;--r3:#BF1E14;--glow-r:rgba(255,59,48,.55);
  --a1:#FFD9A0;--a2:#FF9F0A;--a3:#C46C00;--glow-a:rgba(255,159,10,.55);
  --bezel:linear-gradient(180deg,#FFFFFF 0%,#E4E4EA 55%,#CFCFD6 100%);
  --bezel-in:linear-gradient(180deg,#C9C9D0,#F4F4F7);
  --panel:#E7E7EC;--panel-sh:inset 0 1px 2.5px rgba(0,0,0,.16),inset 0 0 0 .5px rgba(0,0,0,.07),0 .5px 0 rgba(255,255,255,.95);
  --wash-ok:rgba(52,199,89,.26);--wash-bad:rgba(255,59,48,.22);--wash-warn:rgba(255,159,10,.26);
  --knob:linear-gradient(180deg,#FFFFFF,#F0F0F3);--track:linear-gradient(180deg,#D9D9DF,#E9E9ED);
  --accent-ink:color-mix(in srgb,var(--accent) 82%,#000000);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0E10;--surface:#1C1C1F;--surface-2:#232327;--surface-3:#2C2C31;
  --fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.14);--fill-3:rgba(118,118,128,.34);
  --sep:rgba(255,255,255,.09);--hair:rgba(255,255,255,.07);
  --text:#F5F5F7;--text-2:#AEAEB5;--text-3:#8E8E95;
  --red:#FF6B61;--amber:#FFB547;
  --tint-bad:#2B1817;--line-bad:rgba(255,107,97,.34);
  --tint-warn:#2A2112;--line-warn:rgba(255,181,71,.3);
  --sh-1:0 0 0 .5px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.3);
  --sh-2:0 0 0 .5px rgba(255,255,255,.09),0 2px 6px rgba(0,0,0,.5),0 14px 32px rgba(0,0,0,.5);
  --sh-3:0 0 0 .5px rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.4),0 20px 50px rgba(0,0,0,.45);
  --hi:inset 0 .5px 0 rgba(255,255,255,.07);
  --glass-1:#3B3B42;--glass-2:#18181C;--glass-rim:rgba(0,0,0,.65);
  --g1:#B8FFCB;--g2:#30D158;--g3:#14893A;--glow-g:rgba(48,209,88,.6);
  --r1:#FFBDB5;--r2:#FF453A;--r3:#C2231A;--glow-r:rgba(255,69,58,.62);
  --a1:#FFE2AE;--a2:#FFB01F;--a3:#BD7600;--glow-a:rgba(255,176,31,.55);
  --bezel:linear-gradient(180deg,#56565C 0%,#2E2E33 55%,#1D1D21 100%);
  --bezel-in:linear-gradient(180deg,#0C0C0E,#2A2A2F);
  --panel:#0B0B0D;--panel-sh:inset 0 1px 3px rgba(0,0,0,.7),inset 0 0 0 .5px rgba(0,0,0,.6),0 .5px 0 rgba(255,255,255,.07);
  --wash-ok:rgba(48,209,88,.24);--wash-bad:rgba(255,69,58,.26);--wash-warn:rgba(255,176,31,.22);
  --knob:linear-gradient(180deg,#F2F2F5,#D4D4DA);--track:linear-gradient(180deg,#2A2A2F,#3A3A40);
  --accent-ink:color-mix(in srgb,var(--accent) 82%,#FFFFFF);
}

body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font:400 1rem/1.45 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:"kern";text-rendering:optimizeLegibility;overflow-x:hidden;
}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:var(--r-ctl)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ic{display:block;width:1.25rem;height:1.25rem;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}
mark{background:var(--accent-tint-2);color:inherit;border-radius:.25em;padding:0 .08em}
.skip{position:absolute;left:1rem;top:-5rem;z-index:40;padding:.75rem 1rem;border-radius:var(--r-ctl);background:var(--accent-fill);color:var(--on-accent);font-weight:600;text-decoration:none}
.skip:focus{top:.75rem}

/* ── shared controls ─────────────────────────────────────────────────────── */
.seg{display:inline-flex;padding:0;border-radius:.875rem;background:var(--fill);box-shadow:inset 0 .5px 1px rgba(0,0,0,.06)}
.seg button{position:relative;z-index:0;min-width:2.75rem;min-height:2.75rem;padding:0 1.0625rem;border-radius:.875rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font:600 .875rem/1 var(--font);color:var(--text-2);transition:color .18s}
/* the pill is drawn inside the 44 px button, so the whole button is the target */
.seg button::before{content:"";position:absolute;z-index:-1;inset:.1875rem;border-radius:.6875rem;transition:background-color .18s,box-shadow .18s}
.seg button .ic{width:1.05rem;height:1.05rem}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{color:var(--text)}
.seg button[aria-pressed="true"]::before{background:var(--surface);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 1px 1px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.08)}
html[data-theme="dark"] .seg button[aria-pressed="true"]::before{background:#5A5A61;box-shadow:inset 0 .5px 0 rgba(255,255,255,.14),0 1px 3px rgba(0,0,0,.5)}
.btn{min-height:2.75rem;padding:0 1.125rem;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  font:600 .9375rem/1.1 var(--font);background:var(--fill);color:var(--text);transition:background-color .18s,box-shadow .18s,transform .18s}
.btn .ic{width:1.125rem;height:1.125rem}
.btn:hover{background:var(--fill-3)}
.btn.primary{background:var(--accent-fill);color:var(--on-accent);box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 .5px 0 rgba(255,255,255,.22)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.tinted{background:var(--accent-tint);color:var(--accent-ink)}
.btn.tinted:hover{background:var(--accent-tint-2)}
.btn:active{transform:scale(.97)}
.icon-btn{width:2.75rem;height:2.75rem;border-radius:999px;display:inline-grid;place-items:center;background:var(--fill);color:var(--text-2)}
.icon-btn:hover{background:var(--fill-3);color:var(--text)}

/* ── LED: a small glass lamp ─────────────────────────────────────────────── */
.led{
  --d:.75rem;position:relative;display:inline-block;flex:none;width:var(--d);height:var(--d);border-radius:50%;
  background:radial-gradient(circle at 50% 66%,var(--glass-1),var(--glass-2) 80%);
  box-shadow:inset 0 0 0 .5px var(--glass-rim),inset 0 1px 1.5px rgba(0,0,0,.28);
}
.led::after{content:"";position:absolute;left:22%;right:22%;top:8%;height:38%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,0));opacity:.7;pointer-events:none}
.led[data-l="on"]{
  background:radial-gradient(circle at 50% 62%,var(--g1) 0%,var(--g2) 48%,var(--g3) 100%);
  box-shadow:inset 0 0 0 .5px rgba(0,70,25,.5),0 0 .22em .02em var(--glow-g),0 0 .8em .05em var(--glow-g);
}
.led[data-l="bad"]{
  background:radial-gradient(circle at 50% 62%,var(--r1) 0%,var(--r2) 48%,var(--r3) 100%);
  box-shadow:inset 0 0 0 .5px rgba(90,0,0,.5),0 0 .25em .03em var(--glow-r),0 0 .9em .08em var(--glow-r);
}
/* browser reached it, no host word: a ring of green light around dark glass */
.led[data-l="ring"]{
  background:radial-gradient(circle closest-side,var(--glass-2) 0 44%,var(--g3) 50%,transparent 54%),
             radial-gradient(circle at 50% 62%,var(--g1) 0%,var(--g2) 48%,var(--g3) 100%);
  box-shadow:inset 0 0 0 .5px rgba(0,70,25,.5),0 0 .3em var(--glow-g);
}
/* host says running, this device cannot reach it: green core inside an amber ring */
.led[data-l="split"]{
  background:radial-gradient(circle closest-side,var(--g1) 0,var(--g2) 32%,var(--g3) 44%,rgba(0,0,0,.35) 50%,transparent 55%),
             radial-gradient(circle at 50% 62%,var(--a1) 0%,var(--a2) 48%,var(--a3) 100%);
  box-shadow:inset 0 0 0 .5px rgba(90,50,0,.55),0 0 .3em var(--glow-a),0 0 .75em var(--glow-a);
}
/* no host word and the browser cannot reach it: amber ring, dark core */
.led[data-l="aring"]{
  background:radial-gradient(circle closest-side,var(--glass-2) 0 44%,var(--a3) 50%,transparent 54%),
             radial-gradient(circle at 50% 62%,var(--a1) 0%,var(--a2) 48%,var(--a3) 100%);
  box-shadow:inset 0 0 0 .5px rgba(90,50,0,.55),0 0 .3em var(--glow-a);
}
/* healthy and deliberately quiet (the babycam muted on purpose) */
.led[data-l="dim"]{
  background:radial-gradient(circle at 50% 62%,var(--g1) 0%,var(--g2) 48%,var(--g3) 100%);
  box-shadow:inset 0 0 0 .5px rgba(0,70,25,.5),0 0 .2em var(--glow-g);opacity:.72;
}
/* the lens: one big LED in a turned bezel */
.lens{position:relative;flex:none;width:3.25rem;height:3.25rem;border-radius:50%;padding:.3125rem;background:var(--bezel);
  box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.14),0 3px 8px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.7)}
.lens::before{content:"";position:absolute;inset:.25rem;border-radius:50%;background:var(--bezel-in)}
.lens .led{--d:100%;width:100%;height:100%}
.lens .led::after{left:20%;right:20%;top:7%;height:40%;opacity:.8}

/* ── page frame ──────────────────────────────────────────────────────────── */
.page{max-width:120rem;margin:0 auto;padding:0 var(--pad) 2rem}

/* header: who this board is about */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem 1.5rem;padding:.875rem 0 .75rem}
.top-id{display:flex;align-items:center;gap:.875rem;min-width:0}
.host-badge{flex:none;width:2.75rem;height:2.75rem;border-radius:.8125rem;display:grid;place-items:center;color:var(--on-accent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent-fill) 82%,#fff),var(--accent-fill));
  box-shadow:0 1px 2px rgba(0,0,0,.16),inset 0 .5px 0 rgba(255,255,255,.35),inset 0 -.5px 0 rgba(0,0,0,.15)}
html[data-accent="graphite"] .host-badge{background:linear-gradient(180deg,#6B6B72,#3A3A3F);color:#fff}
.host-badge .ic{width:1.375rem;height:1.375rem;stroke-width:1.8}
.host-t{min-width:0}
.host-title{font:600 1.25rem/1.2 var(--font-d);letter-spacing:-.012em}
.host-title .role{font-weight:400;color:var(--text-2)}
.host-facts{display:flex;flex-wrap:wrap;gap:0 .5rem;margin-top:.125rem;font:400 .8125rem/1.45 var(--font);color:var(--text-2)}
.host-facts span+span::before{content:"·";margin-right:.5rem;color:var(--text-3)}
.host-facts .m{font-family:var(--mono);font-size:.75rem}
.top-ctl{display:flex;align-items:center;gap:.75rem;margin-left:auto}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;margin-right:.25rem}
.clock-t{font:600 1.375rem/1.1 var(--font-d);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.clock-d{font:400 .75rem/1.3 var(--font);color:var(--text-2);margin-top:.125rem}
.switch{position:relative;width:3.75rem;height:2.75rem;display:inline-grid;place-items:center;border-radius:999px}
.sw-track{position:relative;width:3.25rem;height:1.875rem;border-radius:999px;background:var(--track);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.22),inset 0 0 0 .5px rgba(0,0,0,.08),0 .5px 0 rgba(255,255,255,.6)}
html[data-theme="dark"] .sw-track{box-shadow:inset 0 1px 3px rgba(0,0,0,.65),inset 0 0 0 .5px rgba(0,0,0,.5),0 .5px 0 rgba(255,255,255,.08)}
.sw-track>.ic{position:absolute;top:50%;width:.875rem;height:.875rem;margin-top:-.4375rem;color:var(--text-3);stroke-width:1.9}
.sw-track>.ic.sun{left:.4375rem}.sw-track>.ic.moon{right:.4375rem}
.sw-knob{position:absolute;top:.15625rem;left:.15625rem;width:1.5625rem;height:1.5625rem;border-radius:50%;background:var(--knob);display:grid;place-items:center;color:#8E6B00;
  box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 1px 1px rgba(0,0,0,.12),0 2px 5px rgba(0,0,0,.2),inset 0 -1px 0 rgba(0,0,0,.05);transition:transform .28s cubic-bezier(.3,.7,.3,1)}
.sw-knob .ic{width:.875rem;height:.875rem;stroke-width:2}
.switch[aria-checked="true"] .sw-knob{transform:translateX(1.375rem);color:#3A4C7A}

/* ── hero: the overall state, first ──────────────────────────────────────── */
.hero{position:relative;border-radius:var(--r-hero);background:var(--surface);box-shadow:var(--sh-3),var(--hi);overflow:hidden}
.hero-main{position:relative}
.hero-main::before{content:"";position:absolute;z-index:-1;left:-1.125rem;top:50%;width:5.5rem;height:5.5rem;margin-top:-2.75rem;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,var(--wash,transparent),transparent)}
html[data-v="ok"] .hero,html[data-v="partial"] .hero{--wash:var(--wash-ok)}
html[data-v="bad"] .hero{--wash:var(--wash-bad)}
html[data-v="notice"] .hero{--wash:var(--wash-warn)}
.hero-in{position:relative;isolation:isolate;display:flex;flex-direction:column;gap:1rem 2rem;padding:1.375rem 1.5rem 1.375rem}
.hero-main{grid-area:main;display:flex;align-items:center;gap:1.125rem;min-width:0}
.hero-txt{min-width:0}
.hero-h{font:600 1.875rem/1.15 var(--font-d);letter-spacing:-.022em;text-wrap:balance}
.hero-h:focus{outline:none}
.hero-sub{margin-top:.3125rem;font:400 1.0625rem/1.4 var(--font);color:var(--text-2);text-wrap:pretty;max-width:52ch}
.hero-facts{grid-area:facts;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1rem;min-width:0}
.hero-extra{grid-area:extra;min-width:0}
@media (min-width:56em){
  .hero-in{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr;grid-template-areas:"main facts" "extra facts"}
  .hero-main{align-self:center}
  .hero-facts{flex-direction:column;align-items:flex-end;justify-content:flex-start;align-self:start}
  .hero-in.has-guide{grid-template-columns:minmax(0,1fr) minmax(0,30rem);grid-template-areas:"main extra" "facts extra";align-items:start}
  .hero-in.has-guide .hero-main{align-self:start}
  .hero-in.has-guide .hero-facts{flex-direction:row;align-items:center;justify-content:flex-start}
}
/* the truth capsule: where the evidence comes from and how old it is */
.truth{display:inline-flex;align-items:center;gap:.625rem;min-height:2.75rem;padding:.3125rem .9375rem .3125rem .375rem;border-radius:999px;background:var(--fill-2);box-shadow:inset 0 0 0 .5px var(--hair)}
.cd{width:2.125rem;height:2.125rem;flex:none;transform:rotate(-90deg)}
.cd circle{fill:none;stroke-width:3.2}
.cd .trk{stroke:var(--fill-3)}
.cd .arc{stroke:var(--text-2);stroke-linecap:round;transition:stroke-dasharray .9s linear}
.truth:not([data-t="live"]) .trk{stroke-dasharray:2.2 3.1}
.truth:not([data-t="live"]) .arc{display:none}
.truth-t{display:flex;flex-direction:column;line-height:1.25}
.truth-t b{font:600 .875rem/1.25 var(--font);font-variant-numeric:tabular-nums}
.truth-t span{font:400 .8125rem/1.3 var(--font);color:var(--text-2);font-variant-numeric:tabular-nums}
.truth-t b span{font:inherit;color:inherit}
.truth .chk{display:none}
html.is-sweeping .truth[data-t="live"] .chk{display:flex}
html.is-sweeping .truth[data-t="live"] .now{display:none}
/* the front panel: one LED per service, grouped by wing */
.panel{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.5rem .875rem;max-width:100%;padding:.5625rem .875rem;border-radius:1rem;background:var(--panel);box-shadow:var(--panel-sh)}
.panel-g{display:inline-flex;flex-wrap:wrap;gap:.4375rem}
.panel .led{--d:.6875rem;cursor:pointer;transition:transform .18s}
.panel .led.is-hot{transform:scale(1.45)}
.panel .led.is-sel{outline:1.5px solid var(--text-2);outline-offset:2px}
html[data-audience="family"] .panel .led{--d:.8125rem}
/* family guidance */
.guide{border-radius:var(--r-card);padding:1rem 1.125rem 1.125rem;background:var(--surface-2);box-shadow:inset 0 0 0 .5px var(--hair)}
.guide h3{font:600 1.0625rem/1.3 var(--font-d);letter-spacing:-.01em}
.guide ol{margin-top:.5rem;display:grid;gap:.375rem;counter-reset:g}
.guide li{counter-increment:g;display:grid;grid-template-columns:1.625rem minmax(0,1fr);gap:.625rem;align-items:start;font:400 1rem/1.45 var(--font);text-wrap:pretty}
.guide li::before{content:counter(g);display:grid;place-items:center;width:1.625rem;height:1.625rem;border-radius:50%;background:var(--accent-tint);color:var(--accent-ink);font:600 .8125rem/1 var(--font);font-variant-numeric:tabular-nums}
.guide-act{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.875rem}
/* operator attention list */
.att{display:flex;flex-wrap:wrap;gap:.375rem}
.att li{display:flex;min-width:0;max-width:100%}
.att-chip{display:inline-flex;align-items:center;gap:.5rem;min-width:0;max-width:100%;min-height:2.75rem;padding:0 .625rem 0 .875rem;border-radius:999px;
  background:var(--tint-bad);box-shadow:inset 0 0 0 .5px var(--line-bad);font:600 .875rem/1.2 var(--font);color:var(--text);transition:filter .15s}
.att-chip[data-tone="warn"]{background:var(--tint-warn);box-shadow:inset 0 0 0 .5px var(--line-warn)}
.att-chip[data-tone="calm"]{background:var(--fill-2);box-shadow:inset 0 0 0 .5px var(--hair)}
.att-chip:hover{filter:brightness(.97)}
html[data-theme="dark"] .att-chip:hover{filter:brightness(1.18)}
.att-chip .led{--d:.625rem}
.att-chip b{flex:none;font-weight:600}
.att-ev{min-width:0;font:400 .75rem/1.2 var(--mono);color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-chip>.ic{width:.875rem;height:.875rem;color:var(--text-3);stroke-width:2.2}
.next{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.5rem .5rem .5rem 1rem;border-radius:var(--r-mid);background:var(--surface-2);box-shadow:inset 0 0 0 .5px var(--hair)}
.next-t{flex:1 1 22rem;min-width:0}
.next h3{display:inline;margin-right:.5rem;font:600 .875rem/1.5 var(--font)}
.next p{display:inline;font:400 .875rem/1.5 var(--font);color:var(--text-2)}
.next code{font:400 .75rem/1.55 var(--mono)}

/* status word chip used for exceptions */
.badge{display:inline-flex;align-items:center;gap:.375rem;min-height:1.5rem;padding:0 .5625rem;border-radius:999px;font:600 .75rem/1 var(--font);white-space:nowrap}
.badge.bad{background:color-mix(in srgb,var(--r2) 13%,transparent);color:var(--red)}
.badge.warn{background:color-mix(in srgb,var(--a2) 16%,transparent);color:var(--amber)}
.badge.calm{background:var(--fill);color:var(--text-2)}

/* ── work area: group rail beside the services ───────────────────────────── */
.work{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem;margin-top:1.25rem}
@media (min-width:62em){.work{grid-template-columns:14.5rem minmax(0,1fr);gap:1.5rem}}
html[data-v="empty"] .work{grid-template-columns:minmax(0,1fr)}
.rail{min-width:0}
.rail-in{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
.rail-in>*,.zoom>*,.zoom-row2>*{min-width:0}
@media (min-width:62em){.rail-in{position:sticky;top:1rem;gap:1.375rem}}
.search{display:flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:0 .5rem 0 .75rem;border-radius:var(--r-ctl);background:var(--fill);box-shadow:inset 0 .5px 1px rgba(0,0,0,.05)}
.search:focus-within{box-shadow:0 0 0 3px var(--focus)}
.search .ic{width:1.0625rem;height:1.0625rem;color:var(--text-2)}
.search input{flex:1;min-width:0;min-height:2.75rem;padding:0;border:0;background:transparent;font:400 .9375rem var(--font);appearance:none;-webkit-appearance:none}
.search input::placeholder{color:var(--text-2);opacity:1}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search input:focus-visible{outline:none}
.kbd{flex:none;min-width:1.5rem;padding:.125rem .375rem;border-radius:.375rem;background:var(--surface);box-shadow:0 0 0 .5px var(--sep),0 1px 0 var(--sep);font:500 .75rem/1.3 var(--mono);color:var(--text-2);text-align:center}
.rail-h{margin:0 0 .375rem .75rem;font:600 .75rem/1.3 var(--font);color:var(--text-2)}
.groups{display:grid;gap:.125rem}
.grp{display:grid;grid-template-columns:1.25rem minmax(0,1fr) auto;align-items:center;gap:.625rem;min-height:2.75rem;padding:0 .75rem;border-radius:var(--r-ctl);
  font:500 .9375rem/1.25 var(--font);color:var(--text);transition:background-color .15s}
.grp .ic{width:1.125rem;height:1.125rem;color:var(--text-2)}
.grp .gn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .gc{display:inline-flex;align-items:center;gap:.375rem;font:500 .8125rem/1 var(--font);color:var(--text-2);font-variant-numeric:tabular-nums}
.grp .gc .led{--d:.5rem}
.grp:hover{background:var(--fill-2)}
.grp[aria-pressed="true"]{background:var(--surface);box-shadow:var(--sh-1)}
.grp[aria-pressed="true"] .ic{color:var(--accent)}
html[data-theme="dark"] .grp[aria-pressed="true"]{background:var(--surface-3)}
.grp.bad .gn{color:var(--red)}
.grp.bad .ic{color:var(--red)}
.view{display:grid;gap:.5rem}
.zoom{display:grid;grid-template-columns:2.75rem minmax(0,1fr) 2.75rem;align-items:center;gap:.25rem;padding:0 .125rem}
.zoom .icon-btn{background:transparent}
.zoom .icon-btn:hover{background:var(--fill)}
.zoom .icon-btn:disabled{opacity:.35;cursor:default;background:transparent}
.view-h{display:flex;align-items:baseline;justify-content:space-between;padding-right:.75rem}
.view-h .rail-h{margin-bottom:0}
.zoom-row2{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:.375rem}
.zoom-val{font:600 .8125rem/1 var(--font);font-variant-numeric:tabular-nums;color:var(--text)}
.zoom-row2 .btn{min-height:2.75rem;padding:0 .625rem;font-size:.8125rem;border-radius:var(--r-ctl)}
.zoom-row2 .btn[aria-pressed="true"]{background:var(--accent-tint);color:var(--accent-ink)}
/* a tactile slider: recessed track, raised knob */
.range{-webkit-appearance:none;appearance:none;width:100%;min-width:0;height:2.75rem;margin:0;background:transparent;cursor:pointer;--p:33.3%}
.range::-webkit-slider-runnable-track{height:.375rem;border-radius:999px;
  background:linear-gradient(90deg,var(--accent-fill) 0 var(--p),var(--fill-3) var(--p) 100%);box-shadow:inset 0 1px 1.5px rgba(0,0,0,.18)}
.range::-moz-range-track{height:.375rem;border-radius:999px;background:var(--fill-3)}
.range::-moz-range-progress{height:.375rem;border-radius:999px;background:var(--accent-fill)}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:1.375rem;height:1.375rem;margin-top:-.5rem;border-radius:50%;background:var(--knob);
  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.22)}
.range::-moz-range-thumb{width:1.375rem;height:1.375rem;border:0;border-radius:50%;background:var(--knob);box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.22)}
.range:focus-visible{outline:none}
.range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--focus),0 2px 6px rgba(0,0,0,.22)}
.range:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--focus)}
.view-toggle{display:none}
@media (max-width:61.99em){
  .rail-in{grid-template-columns:minmax(0,1fr)}
  .rail-sec.grps .rail-h{display:none}
  .groups{display:flex;gap:.375rem;overflow-x:auto;padding:.25rem;margin:-.25rem;scrollbar-width:none}
  .groups::-webkit-scrollbar{display:none}
  .grp{flex:none;grid-template-columns:auto auto auto;background:var(--surface);box-shadow:var(--sh-1)}
  html .grp[aria-pressed="true"],html[data-theme="dark"] .grp[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-accent)}
  .grp[aria-pressed="true"] .ic,.grp[aria-pressed="true"] .gc{color:inherit}
  .grp.bad[aria-pressed="true"] .gn{color:inherit}
  .view-toggle{display:inline-grid}
  .rail-sec.view{display:none}
  .rail-sec.view.is-open{display:grid;padding:.75rem;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-1)}
}

/* main column */
.main{min-width:0}
.main:focus-visible{outline:none}
.main-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;margin-bottom:1rem}
.mh-l{display:flex;flex-wrap:wrap;align-items:baseline;gap:.125rem .75rem;min-width:0}
.mh{font:600 1.25rem/1.2 var(--font-d);letter-spacing:-.012em}
.mh-n{font:400 .875rem/1.3 var(--font);color:var(--text-2)}
.mh-count{font:400 .875rem/1.3 var(--font);color:var(--text-2)}
.mh-count button{min-height:2.75rem;padding:0 .25rem;color:var(--accent);font-weight:600}
.mh-r{display:flex;align-items:center;gap:.5rem;margin-left:auto}
.zoomwrap{min-width:0;zoom:var(--zoom)}

/* ── tiles: big friendly tiles, packed by wing ───────────────────────────── */
.tiles{--t:17.5rem;--tmax:22.5rem;--g:1rem;display:flex;flex-wrap:wrap;gap:1.25rem var(--g);align-items:stretch}
.tiles .wing{--n:1;display:flex;flex-direction:column;min-width:0;
  flex:var(--n) 1 calc(var(--n) * var(--t) + (var(--n) - 1) * var(--g));
  max-width:min(100%,calc(var(--n) * var(--tmax) + (var(--n) - 1) * var(--g)))}
.wing-h{display:flex;align-items:baseline;gap:.5rem;margin:0 0 .5rem .25rem;font:600 1.0625rem/1.3 var(--font-d);letter-spacing:-.01em}
.wing-h .wn{font:400 .875rem/1 var(--font);color:var(--text-2);font-variant-numeric:tabular-nums}
.wing-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--t)),1fr));grid-auto-rows:1fr;gap:var(--g)}
.tile{
  position:relative;display:flex;flex-direction:column;min-width:0;padding:1rem 1.125rem 1rem 1rem;
  border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-1),var(--hi);text-align:left;color:var(--text);
  transition:transform .22s cubic-bezier(.3,.7,.3,1),box-shadow .22s,background-color .2s;
}
a.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2),var(--hi)}
a.tile:active{transform:translateY(0) scale(.985)}
a.tile:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:var(--r-card)}
.t-head{display:flex;align-items:center;gap:.875rem;min-width:0}
.t-ht{display:flex;flex-direction:column;gap:.1875rem;min-width:0}
.app-ic{flex:none;width:2.75rem;height:2.75rem;border-radius:.8125rem;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--surface),var(--surface-3));color:var(--text-2);
  box-shadow:0 0 0 .5px var(--sep),0 1px 2px rgba(0,0,0,.06),inset 0 .5px 0 rgba(255,255,255,.8)}
html[data-theme="dark"] .app-ic{background:linear-gradient(180deg,#3A3A40,#29292E);box-shadow:0 0 0 .5px rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.4),inset 0 .5px 0 rgba(255,255,255,.1)}
.app-ic .ic{width:1.5rem;height:1.5rem;stroke-width:1.6}
a.tile .app-ic{color:var(--accent)}
.t-st{display:inline-flex;align-items:center;gap:.5rem;min-height:1.1875rem;font:500 .9375rem/1.25 var(--font);color:var(--text-2)}
.t-st .led{--d:.75rem}
.t-name{font:600 1.25rem/1.2 var(--font-d);letter-spacing:-.015em;overflow-wrap:anywhere}
.t-purpose{margin-top:.75rem;font:400 1rem/1.4 var(--font);color:var(--text-2);text-wrap:pretty}
.t-foot{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-top:auto;padding-top:.75rem}
.t-code{min-width:0;font:400 .8125rem/1.4 var(--mono);color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-open{flex:none;display:inline-flex;align-items:center;gap:.375rem;min-height:2.25rem;padding:0 .875rem 0 1rem;border-radius:999px;background:var(--accent-fill);color:var(--on-accent);
  font:600 .9375rem/1 var(--font);box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 .5px 0 rgba(255,255,255,.22)}
.t-open .ic{width:1rem;height:1rem;stroke-width:2.1;transition:transform .2s}
a.tile:hover .t-open .ic{transform:translate(1px,-1px)}
.t-ev{margin-top:.375rem;font:400 .75rem/1.4 var(--mono);color:var(--red)}
.tile.passive{background:color-mix(in srgb,var(--surface) 62%,transparent);box-shadow:0 0 0 .5px var(--hair)}
html[data-theme="dark"] .tile.passive{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.tile.passive .t-name{font-size:1.125rem}
.tile.passive .t-purpose{font-size:.9375rem}
.tile.passive:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.tile[data-bad="1"]{background:var(--tint-bad);box-shadow:0 0 0 1px var(--line-bad),var(--sh-1)}
.tile[data-bad="1"] .t-st{color:var(--red);font-weight:600}
.tile[data-l="split"],.tile[data-l="aring"]{background:var(--tint-warn);box-shadow:0 0 0 1px var(--line-warn),var(--sh-1)}
.tile[data-l="split"] .t-st,.tile[data-l="aring"] .t-st{color:var(--amber);font-weight:600}
.tile[data-bad="1"] .t-open{background:var(--surface);color:var(--text);box-shadow:0 0 0 .5px var(--sep),0 1px 2px rgba(0,0,0,.08)}
html[data-theme="dark"] .tile[data-bad="1"] .t-open{background:var(--surface-3)}
html[data-audience="operator"] .tiles{--t:15rem;--tmax:22rem}
html[data-audience="operator"] .tile{padding:.8125rem .875rem .8125rem .8125rem}
html[data-audience="operator"] .t-name{font-size:1.0625rem}
html[data-audience="operator"] .t-purpose{margin-top:.5rem;font-size:.875rem}
html[data-audience="operator"] .t-st{font-size:.8125rem}
html[data-audience="operator"] .app-ic{width:2.25rem;height:2.25rem;border-radius:.6875rem}
html[data-audience="operator"] .app-ic .ic{width:1.25rem;height:1.25rem}
html[data-audience="operator"] .t-open{min-height:2rem;font-size:.8125rem;padding:0 .75rem 0 .875rem}

/* ── list: the compact, scannable density ────────────────────────────────── */
.list{columns:3 19.5rem;column-gap:1.25rem}
.list .wing{break-inside:avoid;page-break-inside:avoid;display:inline-block;width:100%;margin:0 0 1rem}
.list .wing-h{margin:0 0 .375rem .75rem;font:600 .8125rem/1.3 var(--font);letter-spacing:0;color:var(--text-2)}
.list .wing-h .wn{font-size:.8125rem}
.wcard{border-radius:var(--r-mid);background:var(--surface);box-shadow:var(--sh-1),var(--hi);padding:.25rem;container:wcard / inline-size}
.row-li{position:relative}
.row-li+.row-li::before{content:"";position:absolute;left:3.375rem;right:.75rem;top:0;height:1px;background:var(--sep);transform:scaleY(.6)}
.row{position:relative;display:flex;align-items:center;gap:.625rem;width:100%;min-height:2.75rem;padding:.25rem .5rem .25rem .625rem;border-radius:.75rem;color:var(--text);text-align:left;transition:background-color .12s}
.row .led{--d:.625rem}
.r-ic{flex:none;width:1.625rem;height:1.625rem;border-radius:.5rem;display:grid;place-items:center;background:var(--fill-2);color:var(--text-2)}
.r-ic .ic{width:1rem;height:1rem;stroke-width:1.75}
a.row .r-ic{color:var(--accent)}
.r-name{flex:0 0 auto;max-width:64%;font:600 .875rem/1.25 var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-purpose{display:none;flex:1 1 0;min-width:0;font:400 .8125rem/1.25 var(--font);color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-foot{flex:1 1 0;min-width:0;text-align:right;font:400 .75rem/1.25 var(--mono);color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-go{flex:none;width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center;color:var(--text-3)}
.r-go .ic{width:.9375rem;height:.9375rem;stroke-width:2.1}
.r-nogo{flex:none;width:1.75rem}
@container wcard (min-width:30rem){.r-purpose{display:block}.r-foot{flex:0 1 auto;max-width:40%}}
a.row:hover{background:var(--fill-2)}
a.row:hover .r-go{background:var(--accent-fill);color:var(--on-accent)}
a.row:focus-visible,div.row:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;border-radius:.75rem}
.row-li[data-bad="1"] .row{background:var(--tint-bad)}
.row-li[data-l="split"] .row,.row-li[data-l="aring"] .row{background:var(--tint-warn)}
.row-li[data-bad="1"]::before,.row-li[data-bad="1"]+.row-li::before,
.row-li[data-l="split"]::before,.row-li[data-l="split"]+.row-li::before,
.row-li[data-l="aring"]::before,.row-li[data-l="aring"]+.row-li::before{display:none}

/* where a jump lands: a short ring, so the eye finds the row */
.is-pinged{outline:3px solid var(--focus)!important;outline-offset:3px}
.row.is-pinged{outline-offset:-3px}
@keyframes ping{0%,65%{outline-color:var(--focus)}100%{outline-color:transparent}}

/* no match / empty */
.blank.ghost{justify-items:start;text-align:left;max-width:22rem;padding:1.25rem;background:transparent;box-shadow:none;border:2px dashed var(--fill-3)}
.blank{display:grid;justify-items:center;gap:.75rem;padding:2.5rem 1.5rem;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-1);text-align:center}
.blank .app-ic{width:3.25rem;height:3.25rem}
.blank p{max-width:42ch;font:400 1rem/1.45 var(--font);color:var(--text-2)}

/* ── footer: legend, host, help ──────────────────────────────────────────── */
.foot{margin-top:2rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:1rem}
.fcard{padding:1rem 1.125rem;border-radius:var(--r-card);background:color-mix(in srgb,var(--surface) 55%,transparent);box-shadow:0 0 0 .5px var(--hair)}
.fcard h3{margin-bottom:.625rem;font:600 .875rem/1.3 var(--font)}
.fcard p{font:400 .8125rem/1.5 var(--font);color:var(--text-2);text-wrap:pretty}
.legend{display:grid;gap:.4375rem}
.legend li{display:grid;grid-template-columns:1rem minmax(0,1fr);gap:.625rem;align-items:center;font:400 .8125rem/1.35 var(--font);color:var(--text-2)}
.legend .led{--d:.75rem}
.idl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.25rem .875rem;font:400 .8125rem/1.45 var(--font)}
.idl dt{color:var(--text-2)}
.idl dd{overflow-wrap:anywhere}
.idl .m{font:400 .75rem/1.45 var(--mono)}

/* ── sheet: why a service is unreachable from here, and what to try ──────── */
.sheet{position:fixed;z-index:30;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(30rem,calc(100vw - 1.5rem));
  max-height:calc(100vh - 2rem);overflow:auto;padding:1rem 1.125rem 1.125rem;border-radius:1.5rem;background:var(--surface);color:var(--text);
  box-shadow:0 0 0 .5px var(--sep),0 10px 30px rgba(0,0,0,.18),0 30px 70px rgba(0,0,0,.18)}
html[data-theme="dark"] .sheet{background:#26262A;box-shadow:0 0 0 .5px rgba(255,255,255,.1),0 20px 60px rgba(0,0,0,.6)}
.sheet-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.sheet-head{display:flex;align-items:center;gap:.875rem}
.sheet h3{font:600 1.25rem/1.25 var(--font-d);letter-spacing:-.015em}
.sheet .sh-st{display:inline-flex;align-items:center;gap:.4375rem;margin-top:.125rem;font:500 .875rem/1.3 var(--font);color:var(--text-2)}
.sheet p{margin-top:.75rem;font:400 .9375rem/1.5 var(--font);color:var(--text-2)}
.sheet ol{margin-top:.625rem;display:grid;gap:.375rem;counter-reset:s}
.sheet ol li{counter-increment:s;display:grid;grid-template-columns:1.5rem minmax(0,1fr);gap:.5rem;font:400 .9375rem/1.45 var(--font)}
.sheet ol li::before{content:counter(s);display:grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--fill);font:600 .75rem/1 var(--font)}
.url{display:block;margin-top:.75rem;padding:.6875rem .875rem;border-radius:var(--r-ctl);background:var(--fill-2);font:500 .875rem/1.4 var(--mono);color:var(--text);overflow-wrap:anywhere}
.sheet-act{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}

/* ── continuous corners where the engine draws them (Chromium 139+, Safari 26+).
      LEDs, knobs and capsules stay true circles. ─────────────────────────── */
@supports (corner-shape:superellipse(1.5)){
  html{--r-hero:2.125rem;--r-card:1.6875rem;--r-mid:1.25rem;--r-ctl:.9375rem}
  .hero,.tile,.wcard,.guide,.next,.fcard,.blank,.sheet,.grp,.search,.seg,.seg button,.app-ic,.host-badge,.r-ic,.row,
  .zoom-row2 .btn,.url,.kbd,.skip,.panel{corner-shape:superellipse(1.5)}
  .app-ic,.host-badge{border-radius:1.0625rem}
  .r-ic{border-radius:.6875rem}
  .row,a.row:focus-visible,div.row:focus-visible{border-radius:.9375rem}
  .seg,.seg button{border-radius:1.125rem}
  .seg button::before{border-radius:.875rem;corner-shape:superellipse(1.5)}
  .sheet{border-radius:2rem}
  .panel{border-radius:1.25rem}
  .kbd{border-radius:.5rem}
  html[data-audience="operator"] .app-ic{border-radius:.875rem}
}

/* ── motion: LEDs come on as the sweep reports, then the page holds still ── */
@keyframes ledOn{from{filter:grayscale(1) brightness(.82);box-shadow:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:no-preference){
  html.is-sweeping .led:not(.lens .led){animation:ledOn .34s calc(var(--b,0) * 90ms) both}
  html.is-sweeping .lens .led{animation:ledOn .4s .5s both}
  html.is-first .tile,html.is-first .wcard,html.is-first .hero{animation:rise .5s cubic-bezier(.3,.7,.3,1) both}
  html.is-first .tile{animation-delay:calc(var(--i,0) * 40ms + 60ms)}
  .is-pinged{animation:ping 1.8s ease-out both}
  .sheet:not([hidden]){animation:rise .26s cubic-bezier(.3,.7,.3,1) both}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (prefers-contrast:more){
  html[data-theme="light"]{--text-2:#3F3F45;--text-3:#4A4A50;--sep:rgba(60,60,67,.32);--hair:rgba(0,0,0,.2)}
  html[data-theme="dark"]{--text-2:#D0D0D6;--text-3:#B8B8BF;--sep:rgba(255,255,255,.28);--hair:rgba(255,255,255,.24)}
}
@media (forced-colors:active){
  .led{forced-color-adjust:none;border:1px solid CanvasText}
  .tile,.wcard,.hero,.grp,.btn,.seg button,.search{border:1px solid CanvasText}
}
@media (max-width:40em){
  .hero-h{font-size:1.5rem}
  .hero-sub{font-size:1rem}
  .hero-in{padding:1.125rem 1.125rem 1.25rem}
  .lens{width:2.75rem;height:2.75rem}
  .clock-t{font-size:1.125rem}
  .top{padding-top:.75rem}
  .top-ctl{width:100%;justify-content:space-between;margin-left:0}
  .clock{align-items:flex-start;order:-1;margin-right:auto}
}
html[data-audience="operator"] .hero-h{font-size:1.5rem}
html[data-audience="operator"] .hero-sub{font-size:.9375rem}
html[data-audience="operator"] .hero-in{padding:1rem 1.375rem;row-gap:.75rem}
html[data-audience="operator"] .work{margin-top:1rem}
@media (min-width:56em){
  /* the headline keeps its room; a long front panel (csb1: 47 LEDs) wraps instead */
  html[data-audience="operator"] .hero-in{grid-template-columns:minmax(min(100%,21rem),1fr) auto;grid-template-rows:auto auto;grid-template-areas:"main facts" "extra extra"}
}
@media (min-width:75em){
  html[data-audience="operator"] .hero-facts{flex-direction:row;align-items:center;justify-content:flex-end;align-self:center}
  html[data-audience="operator"] .panel .led{--d:.625rem}
  html[data-audience="operator"] .panel-g{gap:.375rem}
}
html[data-audience="operator"] .lens{width:2.75rem;height:2.75rem}
@media (max-width:40em){html[data-audience="operator"] .hero-h{font-size:1.3125rem}}
</style>

<body>
<a class="skip" href="#main" data-i18n="skip">Skip to services</a>
<div class="page">
  <header class="top">
    <div class="top-id">
      <span class="host-badge" aria-hidden="true"><span data-icon="server"></span></span>
      <div class="host-t">
        <h1 class="host-title"><span id="hostName">HostDash</span><span class="role" id="hostRoleWrap"> · <span id="hostRole"></span></span></h1>
        <p class="host-facts" id="hostFacts"></p>
      </div>
    </div>
    <div class="top-ctl">
      <div class="clock" id="clock"><span class="clock-t" id="clockTime"></span><span class="clock-d" id="clockDate"></span></div>
      <div class="seg" role="group" id="languageGroup" data-i18n-aria="language">
        <button type="button" data-language="de" lang="de" aria-pressed="false" aria-label="Deutsch">DE</button>
        <button type="button" data-language="en" lang="en" aria-pressed="false" aria-label="English">EN</button>
      </div>
      <button type="button" class="switch" role="switch" id="themeSwitch" aria-checked="false" data-i18n-aria="dark" data-i18n-title="dark">
        <span class="sw-track"><span data-icon="sun" data-icon-class="sun"></span><span data-icon="moon" data-icon-class="moon"></span><span class="sw-knob" id="themeKnob"></span></span>
      </button>
    </div>
  </header>

  <section class="hero" id="hero" aria-labelledby="heroH"></section>
  <p class="sr" id="heroLive" aria-live="polite"></p>

  <div class="work">
    <nav class="rail" id="rail" data-i18n-aria="groups">
      <div class="rail-in">
        <label class="search"><span data-icon="search"></span><span class="sr" data-i18n="searchServices"></span>
          <input id="q" type="search" data-i18n-placeholder="searchServices" data-i18n-aria="searchServices" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-describedby="qHint">
          <kbd class="kbd" aria-hidden="true">/</kbd></label>
        <span id="qHint" class="sr" data-i18n="searchHint"></span>
        <div class="rail-sec grps"><h3 class="rail-h" id="grpH" data-i18n="groups"></h3>
          <div class="groups" id="groups" role="group" aria-labelledby="grpH"></div></div>
        <div class="rail-sec view" id="viewSec" role="group" aria-labelledby="sizeH">
          <div class="view-h"><h3 class="rail-h" id="sizeH" data-i18n="size"></h3><output class="zoom-val" id="zoomValue" for="zoomRange">100 %</output></div>
          <div class="zoom">
            <button type="button" class="icon-btn" id="zoomOut" data-i18n-aria="zoomOut" data-i18n-title="zoomOut"><span data-icon="minus"></span></button>
            <input class="range" id="zoomRange" type="range" min="50" max="200" step="5" value="100" data-i18n-aria="zoomRange">
            <button type="button" class="icon-btn" id="zoomIn" data-i18n-aria="zoomIn" data-i18n-title="zoomIn"><span data-icon="plus"></span></button>
          </div>
          <div class="zoom-row2">
            <button type="button" class="btn" id="zoomFit" aria-pressed="false" data-i18n-title="fitAll"><span data-icon="fit"></span><span data-i18n="fit"></span></button>
            <button type="button" class="btn" id="zoomReset" data-i18n-aria="resetZoom" data-i18n-title="resetZoom"><span data-icon="reload"></span><span>100 %</span></button>
          </div>
        </div>
      </div>
    </nav>

    <main class="main" id="main" tabindex="-1">
      <div class="main-head" id="mainHead">
        <div class="mh-l"><h2 class="mh" id="mainTitle"></h2><span class="mh-n" id="mainCount"></span><p class="mh-count" id="count" role="status"></p></div>
        <div class="mh-r">
          <button type="button" class="icon-btn view-toggle" id="viewToggle" aria-expanded="false" aria-controls="viewSec" data-i18n-aria="size" data-i18n-title="size"><span data-icon="size"></span></button>
          <div class="seg" role="group" id="densityGroup" data-i18n-aria="density">
            <button type="button" data-density="tiles" aria-pressed="false"><span data-icon="tiles"></span><span data-i18n="tiles"></span></button>
            <button type="button" data-density="list" aria-pressed="false"><span data-icon="list"></span><span data-i18n="list"></span></button>
          </div>
        </div>
      </div>
      <div class="zoomwrap" id="zoomwrap"><div class="services" id="services"></div><div id="empty" hidden></div></div>
    </main>
  </div>

  <footer class="foot" id="foot"></footer>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle" hidden></div>

// <evidence-core>
// ── EVIDENCE CORE (HOSTD-7, HOSTD-10, HOSTD-12, HOSTD-81, HOSTD-83) ─────────────
//
// Everything that decides what a card may CLAIM lives here, free of DOM and globals,
// so scripts/test-evidence.mjs can run it in a bare VM. The rule is the board's whole
// reason to exist: a monitor that reports health it cannot verify is worse than none,
// because it is trusted. So every lit LED names its source:
//
//   host        status.json (docker ps, systemctl, the host's loopback HTTP check, jobs)
//   self        a service's own telemetry in status.json extras (the babycam)
//   browser     a reachability probe from THIS browser, which can never read a status
//               code cross-origin and so proves reachability, never health
//
// No source, no light: "checking", "unknown" and a stale artifact all render as dark
// glass with no word. A stale artifact (older than the limit) is not evidence at all.
const EvidenceCore = (() => {
  const isObj = value => Boolean(value) && typeof value === "object" && !Array.isArray(value);
  const KNOWN_HEALTH = new Set(["AUDIO_DEAD", "VIDEO_STALE", "VOLUME_DRIFT"]);
  // How far the host's clock may run ahead of this browser's before an artifact is
  // rejected as dated in the future. Bounded, so a future stamp extends trust by at most
  // this much instead of indefinitely.
  const CLOCK_SKEW_SEC = 120;

  // Epoch seconds, or null. A number or a plain decimal string; nothing else ("Infinity",
  // booleans, ISO dates, milliseconds that land in the future are all rejected below).
  function epochOf(value) {
    const n = typeof value === "number" ? value
      : typeof value === "string" && /^\s*\d+(\.\d+)?\s*$/.test(value) ? Number(value) : NaN;
    return Number.isFinite(n) && n > 0 ? n : null;
  }

  // Is this artifact evidence right now? Stale is NOT healthy: a dead generator whose
  // last file still says "running" would otherwise keep the board green forever. For the
  // same reason an artifact that cannot age is not evidence at all: no valid timestamp,
  // or one further in the future than clock skew explains (HOSTD-83 gate r1: before,
  // `generated: "Infinity"` read as live with age 0, forever).
  function judgeArtifact(data, nowMs, maxAgeMs, skewSec = CLOCK_SKEW_SEC) {

    const generated = epochOf(data.generated);
    const nowSec = nowMs / 1000;
    if (generated === null || generated > nowSec + skewSec) return { state: "none", key: "badTime" };
    const ageSec = Math.max(0, Math.round(nowSec - generated));
    if (ageSec * 1000 > maxAgeMs) return { state: "stale", key: "staleStatus", ageSec, generated };
    return { state: "live", key: "liveStatus", ageSec, generated };

  // Where a service's link and probe point, or null. A same-host service resolves
  // against the page's own origin (port and path from the config); it needs no `url` of
  // its own (HOSTD-83 gate r1: `sameHost: true, path: "/ops/"` alone lost link and probe).

      if (typeof service.scheme === "string" && /^https?:$/.test(service.scheme)) target.protocol = service.scheme;

      const port = String(service.hostPort || service.port || "").replace(/^:/, "").split(/\s+/)[0];
      if (/^\d+$/.test(port)) target.port = port;

  //
  // HOSTD-83 finding (b): a static `status` (or `statusPolicy.staticState`, or
  // `probe: false`) used to be painted as-is on every sweep — csb1's INSPR site showed a
  // green "External" that nothing had measured. A static status is now only a
  // declaration that the browser must not probe this URL (CORP, auth walls). The card
  // still gets exactly the evidence everything else gets: the host's word, or none.
  function serviceModel(raw, targetUrl) {
    const service = isObj(raw) ? raw : {};
    const policy = isObj(service.statusPolicy) ? service.statusPolicy : {};
    const staticState = typeof service.status === "string" ? service.status
      : typeof policy.staticState === "string" ? policy.staticState
        : service.probe === false ? "external" : null;
    const passive = service.passive === true;
    const str = value => typeof value === "string" && value ? value : null;

      container: str(service.container),
      unit: str(service.unit),
      extra: str(service.extra),
      httpKey: str(service.httpKey),
      passive,
      staticState,
      probeUrl: !passive && !staticState && typeof targetUrl === "string" && targetUrl ? targetUrl : null,
    };
  }

  // What one section of the artifact holds for `name`: undefined when the section does
  // not name it, null when it names it with something that is not a record, else the
  // record. Own properties only, so a name like "constructor" finds nothing inherited.
  function recordIn(status, section, name) {
    if (!name || !isObj(status) || !isObj(status[section]) || !Object.prototype.hasOwnProperty.call(status[section], name)) return undefined;
    const entry = status[section][name];
    return isObj(entry) ? entry : null;
  }

  // HOSTD-83 gate r2: a malformed record is no evidence, never a verdict. Before, `{}` read
  // as "running: false" (Down) and `code: null` as curl's 0 ("No answer"). A malformed
  // record comes back as { malformed: true }; the card ignores it and says why.
  function hostEntry(status, svc) {
    const kind = svc.container ? "container" : svc.unit ? "unit" : null;
    if (!kind) return null;
    const entry = recordIn(status, kind === "container" ? "containers" : "units", svc.container || svc.unit);
    if (entry === undefined) return null;
    // Only an explicit boolean is a running state: `{}`, `running: null` or "true" are not.
    if (entry === null || typeof entry.running !== "boolean") return { kind, malformed: true };
    // A finished job is only a SERVICE the host identifies as a oneshot (systemd
    // Type=oneshot). A timer, socket or daemon that is inactive is stopped, whatever its
    // last run said (HOSTD-83 gate r2: a disabled .timer with an ok record read green).
    const oneshot = kind === "unit" && /\.service$/.test(svc.unit) && entry.type === "oneshot";
    return { kind, running: entry.running, active: typeof entry.active === "string" ? entry.active : null, oneshot };
  }

  // A status code is an integer, 0 (curl got no HTTP answer at all) or 100–599: a number,
  // or curl's own digits ("000", "502"). Anything else is never converted, so null, "",
  // 2.5, 999 or an object with a hostile toString cannot turn into a code (or a throw).
  function codeOf(value) {
    const n = typeof value === "number" ? value : typeof value === "string" && /^\d{1,3}$/.test(value) ? Number(value) : NaN;
    return Number.isInteger(n) && (n === 0 || (n >= 100 && n <= 599)) ? n : null;
  }

  // The host curls the service over loopback (HOSTD-12): the only place a status code
  // is legible. 0 means curl got no HTTP answer at all.
  function hostHttp(status, svc) {
    const entry = recordIn(status, "http", svc.httpKey || svc.container || svc.unit);
    if (entry === undefined) return null;
    const code = entry === null ? null : codeOf(entry.code);
    if (code === null) return { malformed: true };
    if (code === 0) return { kind: "silent", code };
    return code >= 500 ? { kind: "fault", code } : { kind: "ok", code };

  // its own: a job's record is evidence whether or not the artifact also lists the unit.
  // A `last` later than the artifact itself is no date (it would print a future day, or
  // "Invalid Date"); the record then counts undated.
  function hostJob(status, svc) {
    const entry = recordIn(status, "jobs", svc.unit || svc.container);
    if (entry === undefined) return null;
    if (entry === null || typeof entry.ok !== "boolean") return { malformed: true };
    const generated = epochOf(status.generated);

    return { ok: entry.ok, last: last !== null && (generated === null || last <= generated + CLOCK_SKEW_SEC) ? last : null };

  // `health` is a non-empty string. `{}`, `null` or `health: 1` prove nothing (HOSTD-83
  // gate r1: an empty `extras.babycam` used to read "picture and sound moving").
  function selfReport(status, svc) {
    if (!svc.extra || !isObj(status) || !isObj(status.extras)) return { report: null, gap: svc.extra && isObj(status) ? "ev_noTelemetry" : null };
    const x = status.extras[svc.extra];

    if (typeof x.health !== "string" || !x.health.trim()) return { report: null, gap: "ev_badTelemetry" };
    return { report: x, gap: null };

  function noEvidence(svc, truth, s, gap = null) {
    const why = gap ? gap
      : svc.staticState && !svc.container && !svc.unit ? "ev_whyStatic"

          : truth === "none" ? "ev_whyMissing"
            : truth === "checking" ? "ev_checking"

                : svc.staticState ? "ev_whyStatic" : "ev_whyUnbound";

  // ctx: { truth: "live"|"stale"|"none"|"checking", status, probe: settled result|null }
  //
  // Never throws: whatever the artifact holds, one card's record can neither break the
  // board nor stop the cards after it from updating (HOSTD-83 gate r2). Anything the
  // rules below did not anticipate degrades to "no evidence".
  function derive(svc, ctx) {
    try {
      return deriveFrom(svc, ctx);
    } catch {
      return noEvidence(isObj(svc) ? svc : {}, isObj(ctx) ? ctx.truth : null, "unknown", "ev_badRecord");
    }
  }

  function deriveFrom(svc, ctx) {
    const truth = ctx.truth;
    const status = truth === "live" && isObj(ctx.status) ? ctx.status : null;
    const make = (s, l, word, extra = {}) => ({ s, l, word, vars: {}, src: "", ev: [], hostOk: null, ...extra });

    // A service that publishes its own health outranks everything else (HOSTD-10).
    // desired_volume 0 is NOT a fault: the babycam is muted on purpose most nights.

    // nothing else stays dark.

        const code = x.health;
        return make("fault", "bad", KNOWN_HEALTH.has(code) ? `health_${code}` : "healthFault",

      }
      if (x.desired_volume === 0) return make("muted", "dim", "status_muted", { src: "self", ev: [{ key: "ev_selfMuted" }] });

    // run ok", counts as a job, never as running, and never makes a route claim.
    const running = host?.running === true;

    const runEv = job?.ok
      ? [...(running ? hostEv : []), { key: "ev_jobOk", vars: { last: job.last } }, ...(finished ? [{ key: "ev_unitIdle" }] : [])]

      ? make("jobok", "on", "jobOk", { src, ev: [...runEv, ...more] })
      : make(s, "on", runWord, { src, ev: [...runEv, ...more] });

    if (!svc.probeUrl) {
      if (running || jobOnly) return hostCard("running", "host");
      return noEvidence(svc, truth, "unknown", gap);
    }

    // The probe only refines the host's verdict with THIS browser's reachability.
    const result = ctx.probe || null;
    if (!result) {
      if (running || jobOnly) return hostCard("running", "host");
      return noEvidence(svc, truth, "checking", gap);
    }
    if (result.ok) {
      if (running || jobOnly) return hostCard("up", "both", [{ key: "ev_reached" }]);
      return make("reachable", "ring", "status_reachable", { src: "browser", ev: [{ key: "ev_reachedOnly" }] });
    }
    const hostOk = http?.kind === "ok" ? http.code : null;
    // Unreachable without a running row: the amber ring. A job record is kept as
    // evidence, but it is not "host status" about whether the service runs.
    const unvouched = jobOnly ? runEv : [{ key: "ev_noHost" }];
    // Same-origin and readable: this dashboard's own nginx answered with a status code.
    // Handled before the generic unreachable branch so the code is never lost (HOSTD-83
    // gate r1: a running hausnetz behind a 502 used to read "Unreachable").

      }
      // Anything else (404, 5xx): a measured failure of what sits behind this server.
      if (running || jobOnly) return make("fault", "bad", "httpStatus", { vars: { code }, src: "browser", ev: [...runEv, codeEv] });

    else if (away.length) v = "notice";
    else if (pending.length) v = "checking";

  // token. Under steady sweeps faster than a slow probe, every result was dropped:
  // starvation. Here a sweep REQUESTS a probe; a card with one queued or in flight is
  // left alone, so every probe settles and its result is always kept (a result is only

        run(key, url);
      });
      if (queue.length) pumpTimer = schedule(pump, gapMs);

    function run(key, url) {
      const id = ++seq;

      let timer = null;

        cancel(timer);

        const previous = results.get(key);
        if (!previous || previous.seq < id) results.set(key, { ...result, seq: id });
        onSettle(key, results.get(key));
      });
    }

    return {
      request,
      result: key => results.get(key) || null,
      pending: key => inflight.has(key) || queued.has(key),
