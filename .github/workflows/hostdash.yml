name: HostDash
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Package excludes retired JoeDesk subtree
        run: scripts/check-package.sh

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - run: node --check scripts/smoke-ui.mjs
      - name: Service dashboard smoke
        run: node scripts/smoke-ui.mjs
        env:
          BROWSER_PATH: /usr/bin/google-chrome
          HOSTDASH_HOST: csb0
